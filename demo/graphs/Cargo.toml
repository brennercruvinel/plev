[package]
name = "graphs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Graphs drawn live by plev, from the gramorph corpus inputs: d3's Les Miserables with its force simulation and node drag, cytoscape's compound nodes, desktop and web"

# the desktop window is the `graphs` bin (src/main.rs); the web build is the
# `graphs-web` bin, which trunk builds (index.html, `data-bin`): it has its own
# name because trunk picks the wasm artifact by target name, as the uigallery's
# `uigallery-web` does
[[bin]]
name = "graphs"
path = "src/main.rs"

[[bin]]
name = "graphs-web"
path = "src/bin/web.rs"

[dependencies]
engine = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
console_log.workspace = true
console_error_panic_hook.workspace = true
web-sys = { workspace = true, features = ["HtmlElement", "DomStringMap"] }

[features]
# EXPERIMENT (gramorph proof 1): passes the engine's Noto-less build through, to weigh the web build
experiment-no-noto = ["engine/experiment-no-noto"]

[lints]
workspace = true
