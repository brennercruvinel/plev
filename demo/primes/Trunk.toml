# Trunk config for the web build of primes (`trunk serve` from this
# directory). index.html points at this crate's Cargo.toml (bin
# "primes"); trunk runs cargo for wasm32-unknown-unknown, applies
# wasm-bindgen, and emits into dist/. Ports: the uigallery 8080, the
# urnadbapp 8081, the graphs 8082, this one 8083, so all run at once.

[build]
target = "index.html"
dist = "dist"
# Engine plus cosmic-text in debug wasm is huge and slow; always ship opt.
release = true

[serve]
addresses = ["127.0.0.1"]
port = 8083
open = false
