# machine-readable architecture map. agents read this at task start.
# update together with arc.md and arc.mmd on any structural change.
project: plev
kind: gpu-first compositing engine
language: rust (edition 2024)
stack: [wgpu 28, winit 0.30, cosmic-text 0.18, taffy 0.9, lyon]
targets:
  shipping: [macos-metal, web-webgpu]
  in-progress: [android-vulkan]
  pending: [ios-metal, linux-vulkan, windows-d3d12]
modules:
  gpu:        { path: src/gpu,        role: device/surface/pipelines + GpuVec buffers (vec) + texture_pool, contracts: [srgb-view-formats, surface_render_view-only] }
  compositor: { path: src/compositor, role: scene nodes + dirty layers, depends: [gpu] }
  text:       { path: src/text,       role: shaping + glyph atlas + TextMeasurer, depends: [gpu], contracts: [one-textstyle-measure-and-draw] }
  path:       { path: src/path,       role: lyon tessellation, contracts: [auto-finish-open-subpaths] }
  layout:     { path: src/layout,     role: taffy wrapper (flex, percent, measure-fns), depends: [text] }
  input:      { path: src/input,      role: pointer + hit regions + touch synth + gestures + scroll + dispatch }
  animation:  { path: src/animation,  role: tween/frameclock/easing (dt-based) }
  perf:       { path: src/perf,       role: PerfMonitor rolling windows (fps, dt percentiles, cpu micros, memory) + PerfHud overlay, depends: [animation, compositor, text], contracts: [pure-no-gpu, hud-implies-continuous-frames] }
  signal:     { path: src/signal,     role: reactive primitives }
  window:     { path: src/window,     role: app runner, render-on-demand, render passes, wasm canvas, depends: [gpu, compositor, text, input] }
  theme:      { path: src/theme,      role: measured hoff tokens, oklch }
  ui:         { path: src/ui,         role: retained widgets + icons }
  builder:    { path: src/builder,    role: declarative element tree -> layout -> emit, depends: [layout, text] }
  component:  { path: src/component,  role: Lifecycle trait }
  view:       { path: src/view,       role: View trait + ViewContext }
  text_input: { path: src/text_input, role: single-line field widget }
  platform:   { path: src/platform,   role: safe areas + ime + app lifecycle (mod/ime/lifecycle) }
crates:
  showcase:   { path: crates/showcase,  role: widget gallery app, targets: [desktop, web] }
  ide:  { path: crates/ide, role: git client app }
  rope:{ path: crates/rope, role: rope/transactions/multi-cursor, pure }
  git:{ path: crates/git, role: gix + cli git operations, desktop-only }
  narrate:    { path: [crates/narrate, crates/narrate_macro], role: ui dsl (experimental) }
  macros:     { path: macros,           role: proc-macros }
  lot:        { path: crates/lot,       role: lottie (bodymovin) importer: serde model + keyframe eval + hierarchical render to TessellatedPath (rnd), and the exit door cnv: sample once, dedup payloads, discover deltas, encode .monster; playback then runs on monster only, depends: [path], emits-to: [monster] }
  parser:        { path: crates/parser,       role: parse-resolve-emit transpiler poc (react tsx+sass and gpui -> plev builder source via tree-sitter; HOFF token mapping, honest droplist with file:line, golden + compile tests), depends: [builder, theme (emitted code only)] }
  monster:        { path: crates/monster,       role: binary animation codec (ir/validate/write/read) with full delta ops (modify tracks + place/replace/remove), delta discovery from sampled frames (discover/discover_fit: encoder mode b, slot diffing + linear segment fitting + keyframes on discontinuity and cadence), encoder-side optimizer (optimize: idempotent static collapse + rdp keyframe reduction + collinear fusion, tolerances in wire quantization steps) + deterministic player (play/play_eval: tick-driven, windowed eval, segment-local op replay, signals, lowers ir to SceneNode), depends: [animation, signal, compositor] }
knowledge:
  operating-manual: kdb/how-to/code-against-the-plev-engine.md
  visual-tokens: kdb/reference/hoff-visual-tokens.md
  pixel-validation: kdb/how-to/validate-visuals-by-pixel.md
  brain: kdb/brain-fable-e-bre/readme.md
invariants:
  - one TextStyle per run shared by measure and draw
  - srgb decode once in, encode once out (surface_render_view)
  - geometry derives from available space
  - visible change implies invalidation
  - wasm check must stay green
