cli = ["commit", "intent"]
# binaries of the libraries: the importer's converter (lottie and svg to
# .monster) and transpiler, the engine's headless text probe.
bins = ["import/convert", "import/transpile", "engine/text_probe"]
notes = [
  "text_probe is headless through engine::drawing::headless (the window's own frame path into a texture, no second pipeline); with uigallery --render and player --frame it is the tool behind docs/ref/validate-visuals-by-pixel.md",
  "the builder, charts, text and visual examples and the widgets' editor example had no place in the 2026-10 tree; they are in the history",
  "the remaining demo palettes (inputs, layers, mobile, camera) are views over Theme::default(), not their own color systems",
]

[benches]
# criterion benches (harness = false) on each crate's hot path. run with
# `cargo bench -p <crate>`.
engine = "benches/scene_build.rs (scene build cost)"
editor = "benches/edit.rs (build + insert/delete roundtrip)"
motion = "benches/codec.rs (encode/decode/optimize a snapshot scene)"
import = "benches/lottie.rs (lottie json -> .monster) and benches/gpui.rs (gpui separator transpile end to end)"
# not criterion: the engine's tests/editor.rs (ignored, release) opens,
# scrolls and edits a million-line document; rust/llmrun's bin llm-bench
# measures inference.

[knowledge]
operating-manual = "docs/ref/code-against-the-plev-engine.md"
pixel-validation = "docs/ref/validate-visuals-by-pixel.md"
visual-tokens = "rust/engine/src/styling/theme/hoff.rs (colors + glass) and rust/engine/src/styling/theme/scales.rs (shape, control, size, duration, layout, shadows)"
component-catalog = "docs/ref/component-catalog.md"
decisions = "docs/adr/"
conventions = ".devops/rules (mantras and taboos)"
web-target = "docs/ref/build-and-serve-the-web-target.md"
agent-orchestration = "docs/ref/orchestrate-coding-agents-on-this-repo.md"
program = "docs/log/generative-runtime-program.md (goal, task graph, ownership; thesis and guidelines beside it)"

# binding contracts. violations are defects even if the pixels look right.
[contracts]
invariants = [
  "one TextStyle per text run, shared by measurement and drawing",
  "srgb decode exactly once entering gpu work; encode exactly once at the surface write (surface_render_view; to_linear_array)",
  "container geometry derives from available space, never from constants",
  "ui designed for content, constraints, capabilities and ranges, not screens and devices (fluid scale, component-driven responsiveness, intrinsic layout, relative and semantic values, progressive adaptation)",
  "visible state change implies invalidation (render on demand)",
  "clip rects are logical; scale by clip_scale for physical scissors",
  "wasm check must stay green",
]

# ---------------------------------------------------------------------------
# prose. the human reference that used to be arc.md.
# ---------------------------------------------------------------------------

[prose]
app-pattern = '''
one pattern ships: state in plain structs + retained widgets + explicit
invalidation (adr official-app-pattern). the showcase is the template:
page structs own state, widgets return EventResult, handlers merge
results and report `changed`, tick advances animations gated by the
visible page. the declarative builder is supported for prototypes and
demos. `view`, `component`, `signal` and `narrate` are experimental: no
new app code without an adr.

the widgets are the `comps` crate (adr comps-one-design-system-crate):
every visual value is a `Theme` token (engine::styling::theme), never a literal in
a widget; the widgets that lay out from tokens take `&Theme` on
`handle_event` too, so events and pixels come from one geometry. an app
frames itself with `engine::widgets::shell::AppShell` (sidebar full / rail / drawer
by breakpoint, header, content rect, safe area) and draws its screens
from comps; the only tokens an app owns are domain colors (the ide's file
status), derived from the theme.

apps consume the engine and comps; they never reimplement their
capabilities (adr content-driven-layout-not-fixed-constants and the engine
manual record why).
'''

workspace = '''
three tiers (adr workspace-engine-at-root-libs-in-crates-demos-in-examples):
the engine is one crate at rust/engine, the root is a virtual workspace,
libraries and apps are sibling crates under crates/, and the demos are the
engine's examples. cargo hygiene: workspace.package, workspace.dependencies
(single version source), workspace.lints, tuned profiles; every crate
publish = false.

crate roles in one breath: `engine` the compositing engine itself; `comps`
the design system (widgets, recipes, icons, charts, overlays, editor,
shell) over the engine's tokens; `monster`
the binary animation codec (.monster, adr
binary-animation-format-with-discovered-deltas); `lot` the lottie importer
that converts to .monster and never embeds a foreign runtime (adr
import-foreign-formats-by-conversion-not-embedding); `svg` the still-image
importer on the same exit door; `parser` the ui transpiler poc; `rope` the
text-editing core; `git` git ops; `ide` the git client app; `showcase` the
design-system gallery; `urnaui` the .urna explorer (desktop via mmap
urna-runtime + worker thread + ffmpeg frame previews of inlined media, web
via a portable in-memory reader), its own workspace because the native
backend path-depends on ../urna (adr
urnaui-media-frames-in-place-via-ffmpeg-subfile, adr
worker-results-wake-the-event-loop); `prime` the
prime-coherence particle swarm; `narrate`/`narrate-macro` the experimental
dsl; `macros` the #[component] proc-macro.

the semantic layer, over the engine: `sem` the contract every control
projects (id, role, state, actions, constraints; the dispatcher, the
preconditions and the receipts); `wire` the agent port (observe and act
over a local socket, through the same dispatcher as a click); `rec` the
session recorder; `inspect` and `inspector` read a recorded session and
answer why, and never run anything; `uir` the plev IR and its verifier;
`surface` a verified IR made into a live surface; `propose` an intent to
a verified IR, by rules or by a model behind a trait; `claude-model` the
Claude behind that trait, through the local `claude -p`; `llm` a language
model in process (candle and burn), its own workspace like urnaui.
'''

frame-flow = '''
event -> input state / app state mutation -> invalidate (request_redraw)
-> build scene (per-frame regeneration, no retained diffing) -> compositor
resolve (dirty layers only) -> text resolve (atlas) -> encode layer passes
(quads, sdf, shadows, images, text, backdrop blur, in push order) ->
composite pass to the srgb surface view -> present. a covered window
draws nothing (the surface answers occluded) and redraws when it shows
again. an unchanged layer is
not redrawn, but every frame drawn composites every visible layer
(task-73). a caret or a toast at rest asks for a deadline, not for frames
(engine::widgets::Wake, task-82): the shells sleep with ControlFlow::WaitUntil and
catch time up as the loop wakes; what still draws with nothing visible
changed is debt (the accessibility bridge's wakes, a toast's spring
settling below a pixel).
'''

targets = '''
macos metal (shipping), browser webgpu via trunk/wasm32 (shipping; 79
of the gallery's 82 pages match the desktop byte for byte, the other three
show different content on purpose, adr what-identical-means), android
vulkan and ios metal (both run the showcase: an
apk via a GameActivity host, and the ios simulator via a thin objc shell
that calls `uigallery_ios_main`; see apps/uigallery/android/ and apps/uigallery/ios/),
linux/windows (untested, wgpu primary backends).
'''

errors-and-versioning = '''
pre-1.0: no api stability promised. library code must not panic on user
input paths; tessellation and parsers degrade gracefully (log + empty
output). binary/format versioning follows the anim-format rules
implemented in rust/motion (docs/ref/monster-format-v0.md): explicit
version, frozen golden fixtures, per-section checksums. the full delta op
set is decodable: modify becomes tracks, place/replace/remove become
timeline op lists that act inside their keyframe segment. both encoder
modes exist: mode a lowers an authored timeline (write), mode b discovers
deltas from a sampled frame sequence (discover): slot diffing emits the
structural ops, per-prop runs merge into linear segments, snapshots are
inserted on discontinuity and on the random access cadence. an
encoder-side optimizer (optimize) runs idempotent passes over any timeline
before encoding: static track collapse, rdp keyframe reduction and
collinear segment fusion, tolerances expressed in wire quantization steps
with lossless-on-the-wire defaults. rust/motion also ships the player:
AnimationTick-driven, deterministic f32 timeline, windowed segment
evaluation plus segment-local structural op replay (seek stays O(1) in
frames), play/pause/scrub via signals, lowering its ir scene to SceneNodes
that the app pushes per frame.
'''

# ---------------------------------------------------------------------------
# the frame-flow diagram (mermaid). literal string: copy the value into a
# mermaid renderer or a ```mermaid block to draw it.
# ---------------------------------------------------------------------------

[diagram]
frame-flow = '''
sequenceDiagram
    participant E as event (winit/touch/ime)
    participant I as input state
    participant A as app state
    participant S as scene build (per frame)
    participant C as compositor (dirty layers)
    participant T as text system (atlas)
    participant G as gpu passes
    participant P as surface (srgb view)

    E->>I: pointer / synthesized touch
    I->>A: events to the view, which hit-tests its own rects
    %% hit regions and InputState run only in engine::runtime::window::App and the
    %% builder; the showcase and the ide hand events straight to their view
    A->>A: mutate state
    A->>C: invalidate + request_redraw
    Note over A,C: render on demand: no change, no frame
    %% exceptions today: the accessibility bridge's wakes and a toast's
    %% spring settling below a pixel (task-82 debts), and every visible
    %% layer composited (task-73)
    A->>S: build scene nodes
    %% animation playback: rust/motion MonsterPlayer consumes the tick at A
    %% and hands S a lowered SceneNode scene (scene_at)
    S->>C: push to layers (hash per layer)
    C->>C: resolve only dirty layers
    C->>T: resolve text runs (one TextStyle measure==draw, atlas raster at hidpi scale)
    T->>G: glyph atlas quads
    C->>G: encode layer passes (quads, sdf, shadow, image, text, backdrop)
    G->>P: composite into srgb view (encode-on-write)
    P->>P: present (compared with the desktop per target, adr what-identical-means)
    %% perf (opt-in via RenderConfig): AnimationTick + RenderStats feed
    %% rust/engine/src/runtime/perf PerfMonitor after submit; log line every N frames and/or
    %% PerfHud overlay layer drawn by C (hud on = continuous frames)
'''
