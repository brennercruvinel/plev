# plev architecture, one file (the atlas). the machine map, the human
# reference and the frame-flow diagram used to be three files (arc.yaml,
# arc.md, arc.mmd), then one arc.toml; they live here now, in this
# order: map, then prose, then the diagram. the names of the 2026-10 tree
# (accord for sem, plevir for uir, uigallery for showcase, ...) are in
# docs/TERMS.toml; the prose keeps the history it tells.
# agents read the map at task start; humans read the prose; the diagram is
# mermaid inside a literal string, paste it into any mermaid renderer.
# update this file with any structural change. tool/tests/test_repoaudit.rs
# fails the build if a workspace crate is missing here.

[project]
name = "plev"
kind = "gpu-first compositing engine with a semantic contract that people, screen readers and agents operate"
language = "rust (edition 2024)"
stack = ["wgpu 29", "winit 0.30", "cosmic-text 0.18", "taffy 0.9", "lyon"]

[project.targets]
shipping = ["macos-metal", "web-webgpu"]
# android + ios both run uigallery (apk via GameActivity; ios on the
# simulator via a thin objc shell). see [platform-apps].
in-progress = ["android-vulkan", "ios-metal"]
pending = ["linux-vulkan", "windows-d3d12"]

[layout]
# the root is a virtual workspace; every crate sits in one of four homes by
# what it is: a library (rust/), an app (apps/), a demo (demo/) or tooling
# (tool/). the engine is the library rust/engine; the design system is its
# widgets module.
root = "virtual workspace (Cargo.toml = members + workspace.package/deps/lints/profiles only)"
engine = "rust/engine"
libraries = "rust (accord, claude, editor, engine, gitdrv, import, llmrun, macros, markup, motion, offers, plevir, record, replay, screen, socket)"
apps = "apps (agenteval, idestudio, inspector, mirroring, uigallery, urnadbapp)"
demos = "demo (one crate per demo: arcade, camera, commit, inputs, intent, layers, lottie, mobile, mockup, player, primes, shapes, ticker)"
tooling = "tool (bench/measure and bench/regress: the measurement and the structural regression; tasks: the scripts; tests: the architecture tests)"
data = "data (media/lottie: the lottie references the importer and the gates read; graphs/<format>: the graph inputs a demo draws, d3 and cytoscape, from the gramorph corpus)"
knowledge = "docs (adr by theme + log + pub + ref; this file lives at docs/ATLAS.toml, the glossary at docs/TERMS.toml)"
web = "apps/uigallery/web (Trunk.toml + index.html + dist output; tool/tasks/webtarget.sh is the dev loop; apps/urnadbapp/web + tool/tasks/webtarget.sh urnadbapp for the urnadbapp target)"
scripts = "tool/tasks (fullcheck.sh = the gate: test, clippy, fmt, wasm check, docs links, urnadbapp leg; webtarget.sh = trunk dev loop; screencap.sh web|ios|android = one gallery page or all of them on a target, classified against the desktop frame; mobileapp.sh android|ios|ios-run = the mobile builds; figmapull.py = a .fig screen to the importer's Figma fixture; subsetter.py = the embedded Noto subsets, reproducible, --check compares byte for byte; depscheck.sh, namecheck.sh = the architecture tests; precommit = the git hook)"
contracts = ".devops/check (lychee, nextest and typos configs); .devops/rules and .devops/agent for the agents' rules and skills; .github/workflows/gatecheck.yml is the CI"

# ---------------------------------------------------------------------------
# the engine's internal layers, under rust/engine/src, bottom up.
# ---------------------------------------------------------------------------

[modules.gpu]
path = "rust/engine/src/drawing/gpu"
role = "wgpu device/surface/pipelines; srgb view formats; image atlas; GpuVec buffers (vec); texture_pool; wgsl shaders (gpu/shaders); a lost device recovers in place (recover); GpuContext::instance and adapter with device and queue are what a library that computes on the renderer's device takes (burn through cubecl, rust/llmrun feature plev), and RenderConfig::compute (off by default) asks the adapter's limits and the features granted for it"
contracts = ["srgb-view-formats", "surface_render_view-only"]

[modules.compositor]
path = "rust/engine/src/drawing/compositor"
role = "scene nodes, layers with dirty hashes, resolve to gpu buffers; the semantic binding table beside the scene (task-59, adr semantic-binding-beside-the-scene): bind/bind_to_layer record SemId -> Binding { rect, layer, clip read from the layer's own clip nodes, order, view } per frame, never part of a layer hash; hit(x, y) returns the topmost bound id"
depends = ["gpu", "accord"]

[modules.text]
path = "rust/engine/src/drawing/text"
role = "cosmic-text shaping, gpu glyph atlas (rasterized at the hidpi raster scale, warns once per non-embedded font; color glyphs as four R8 texels per pixel, marked by a negative u, drawn with their own colors), TextMeasurer (the only width source; clusters_styled gives each cluster's box and bidi level for carets and selections), one FontSystem constructor for the embedded faces (Inclusive Sans, Inter, codicons, then Noto Sans for arabic, hebrew, devanagari, SC, JP and KR, and Noto Color Emoji last; fonts.rs, adr embedded-fonts-by-script), a shaping cache per line of text under a byte budget (cluster_cache.rs) for large documents"
depends = ["gpu"]
contracts = ["one-textstyle-measure-and-draw", "glyphs-rasterize-at-raster-scale-hidpi", "warn-once-on-non-embedded-font"]

[modules.path]
path = "rust/engine/src/drawing/path"
role = "lyon tessellation behind PathBuilder"
contracts = ["auto-finish-open-subpaths"]

[modules.layout]
path = "rust/engine/src/compose/layout"
role = "taffy wrapper: flex, percent, text measure functions"
depends = ["text"]

[modules.input]
path = "rust/engine/src/control/input"
role = "pointer state, hit regions, touch tracker + gesture recognizer, touch-to-pointer synth, scroll, dispatch. InputState and its hit regions run only in engine::runtime::window::App and the builder; the shells that ship hand pointer events straight to their view (the showcase, as engine::widgets::WidgetEvent) or workbench (the ide), which hit-tests with the rects it draws (apps/uigallery/src/shell/mod.rs, apps/idestudio/src/main.rs)"

[modules.animation]
path = "rust/engine/src/compose/animation"
role = "Tween, Spring, FrameClock, easing (dt-based; web_time); set_reduced_motion holds the system's reduce motion per thread (task-75 phase 1): on, a spring lands and a finite tween completes on the next tick, a tween repeating forever runs on; a thread starts with it off, so tests and baselines never see a person's setting"

[modules.perf]
path = "rust/engine/src/runtime/perf"
role = "PerfMonitor: rolling windows over AnimationTick + RenderStats (fps, dt p50/p95/p99, cpu micros, memory incl. native rss); PerfHud overlay layer; opt-in via RenderConfig (perf_log, perf_hud); gpu timestamp queries pending (gpu_micros stays None). perf::stages (task-73 phase 1): per-frame, per-thread cost by stage (projection, scene build, measure hit/miss, shaping, bind, hit test, layer hash, geometry, text resolve, upload bytes, encode, gpu wait), off by default and one relaxed load when off; tool/bench/measure/src drives nine interactions through the frame path and prints the tables (docs/log/steps/task-73-measurements.md); RenderConfig::gpu_timestamps (off by default, no device feature when off) adds timestamp queries around the layer and composite passes of draw_frame, read a frame late, as the GpuSpan/GpuLayers/GpuComposite stages and PerfMonitor::record_gpu_micros (task-73 phase 1b)"
depends = ["animation", "compositor", "text"]
contracts = ["pure-no-gpu", "hud-implies-continuous-frames"]

[modules.signal]
path = "rust/engine/src/runtime/signal"
role = "reactive primitives (experimental: no new app code without an adr, see official-app-pattern)"

[modules.window]
path = "rust/engine/src/runtime/window"
role = "App runner: event loop, render-on-demand, render passes, wasm canvas; draw_frame draws a built scene into any srgb view (resolve, text, images, layer passes, composite, submit) and present_frame is acquire + draw_frame + present, the shared path every app (showcase, ide, urnaui) goes through (adr headless-render-shares-the-frame-path)"
depends = ["gpu", "compositor", "text", "input"]

[modules.effects]
path = "rust/engine/src/drawing/effects"
role = "EffectProcessor: the blur, shadow and composite pipelines and the passes that run them over pooled textures. draw_frame uses its two-pass blur for backdrop-blur nodes and composites with no per-layer effect (&[]); only engine::runtime::window::App's own frame tail (window/render.rs) applies the per-layer blur and shadow"
depends = ["gpu"]

[modules.actions]
path = "rust/engine/src/control/keymap"
role = "zed-style key bindings: Keystroke, KeyContext and ContextStack, the json Keymap and KeymapMatcher resolve a key to an action name, ActionRegistry builds the boxed Action. it knows nothing of sem: no binding names a capability; the ide sends the keys that act on one through its Workbench"

[modules.accessibility]
path = "rust/engine/src/control/accessibility"
role = "behind the accessibility feature (on by default; task-60, adr accessibility-projects-the-semantic-snapshot): tree::build projects a sem Snapshot into an AccessKit tree placed by the compositor's bindings, NodeIds follow each SemId across frames, role maps sem roles, action::translate turns a screen reader's request into a sem Request with Actor::Assistive for the app's dispatcher, focus::next walks the snapshot's focus order (called only by a test today); Bridge (native only) attaches accesskit_winit to a hidden window, used by the showcase shell and engine::runtime::window::App; since task-75 phase 1 (adr accessibility-is-production-ready-per-platform) a Status is a polite live region and an Alert an assertive one, the words its value (its own, else its message state, else its label), the focus untouched; a button, link or menu item with one action without a parameter is pressed by it; a group that names and does nothing is a GenericContainer; motion reads the system's reduce motion (macOS: /usr/bin/defaults, when the bridge attaches and when the window takes the focus; None elsewhere) into animation::set_reduced_motion; since task-75 phase 2a present holds inside an item of a collection the actions its own node does not reach (its toggle as a checkbox, any other action without a parameter as a button, '<item>[<action>]', in the tree only, no bounds; a click on one is the item's action through the app's dispatcher), a select is pressed open or shut and set by its value (action::setter), a press is offered only while its action is on, a status's words are its name too (Windows and AT-SPI announce the name), a group named by its own key is named by the labels inside it"
depends = ["compositor", "accord"]

[modules.headless]
path = "rust/engine/src/drawing/headless"
role = "native only: svg::export writes the scene as SVG (one element per node in composite and push order, text as the outlines of the glyphs the frame shaped through TextSystem::shaped_glyphs, every approximation reported per node, task-66b, adr svg-export-reads-the-scene); Renderer over GpuContext::new_headless (no surface, Rgba8UnormSrgb, same from_device pipelines as a window) drawing through window::draw_frame into an offscreen texture; read_texture with 256-byte row padding; Frame -> png through the image crate; typed HeadlessError; None when there is no adapter so tests skip. uigallery --render and player --frame use it; text::probe renders through it (task-66)"
depends = ["gpu", "compositor", "text", "window"]

[modules.hot_reload]
path = "rust/engine/src/runtime/hot_reload"
role = "desktop debug builds only (cfg(hot_reload) from build.rs, feature on by default): shader watcher owned by GpuContext (a saved .wgsl swaps its pipeline, wakes the loop via request_redraw, every layer redraws); literal reload (a saved .rs whose only change is strings or hex colors is applied in place at TextNodeKey, TextMeasurer, push_to_layer and the clear color, state intact; baseline = the sources at process start, skeleton hash + literal list per file via proc-macro2); code changes rebuild (cargo build -p $CARGO_PKG_NAME) and exec the fresh binary; narrate DSL override map (experimental, polled by window::App only)"
depends = ["gpu", "compositor", "text", "effects"]
contracts = ["never-in-release-wasm-mobile", "state-preserved-on-literal-reload"]

[modules.theme]
path = "rust/engine/src/styling/theme"
role = "the design tokens: measured hoff colors + glass recipe, typography ramp, spacing, radius ladder + shape roles, control sizes, container sizes, durations, layout breakpoints/gutters/sidebar mode, shadow stacks by elevation, intents, oklch tooling; hoff dark + hoff light + hoff core (the typescript kit: nine shades, six accents, depths, Inter, plus theme.button: a recipe per button variant and state, the tailwind class lists as tokens) + 11 named palettes. every widget in rust/engine/src/widgets reads from here; no widget restates a number"

[modules.graph]
path = "rust/engine/src/widgets/graph"
role = "graphs, three questions kept apart so every kind of graph reuses them: model.rs (Graph: nodes with id, label and kind; edges with weight and direction; groups that hold nodes and groups; no color, no position), look.rs (Look: one NodeLook per node and one EdgeLook per edge, computed from the data by Look::of, colors as theme Tones) and layout/ (Layout: force.rs d3-force ported, ticking; compound.rs groups solved from the inside; one file per algorithm). the components, one folder each: live_graph (LiveGraph::new(graph, look, layout): positions as state, node and group drag, pan, zoom, hover, selection; draw.rs the two layers, hit.rs the hit grid) and graph_view (GraphView: a layout computed once from its own GraphSpec in graph_view/geometry.rs, re-exported as engine::widgets::graph::geometry)"

[modules.clipboard]
path = "rust/engine/src/runtime/platform/clipboard.rs"
role = "the one clipboard entry point: ClipboardProvider trait, SystemClipboard (arboard, desktop) and LocalClipboard (tests, wasm, mobile)"

[modules.builder]
path = "rust/engine/src/compose/builder"
role = "declarative element tree (div/text/button) -> layout -> emit; supported for prototypes and demos"
depends = ["layout", "text"]

[modules.component]
path = "rust/engine/src/compose/view"
role = "Lifecycle trait (experimental, see official-app-pattern)"

[modules.view]
path = "rust/engine/src/compose/view"
role = "View trait + ViewContext (experimental, see official-app-pattern)"

[modules.platform]
path = "rust/engine/src/runtime/platform"
role = "safe areas (mod), ime, app lifecycle"

[modules.widgets]
path = "rust/engine/src/widgets"
role = "the plev design system: every widget, recipe, icon, chart, overlay and the editor, one crate over the engine, every visual value read from engine::styling::theme::Theme (docs/ref/component-catalog.md is the inventory). categories: core (Rect/WidgetEvent/EventResult, color helpers), wake (Wake: what a tick asks of the loop, a frame now and the deadline of the next, merged by earliest; Blink: the caret clock the text widgets share; task-82, adr a-tick-asks-for-a-deadline), recipe (glass pill/surface, edge light, inset key-light, shadow stacks, focus ring), icons (lucide set), action (button, icon button, chip, badge), form (text field over the text_input core: bidi caret and selection by screen order, an input method's composition drawn inline and kept out of the buffer and the projection, copy, cut, paste and select all through a ClipboardProvider the owner hands in (ClipKey); checkbox, switch, slider, select), nav (tabs, nav link, sidebar by breakpoint, panel header, breadcrumb, split pane), content (card, avatar, panel, stat, code block, skeleton, table, empty state, virtual list, tree, separator), feedback (modal, context menu, toast, tooltip, progress, spinner, scrollbar), overlay (the overlay stack with spring motion), charts (geometry + draw), graph (GraphView), editor (rope-backed multi-cursor editor view: only the visible lines are shaped and drawn, row positions in f64, a million lines open in about 20 ms in release; ime composition inline), shell (AppShell: sidebar + header + content rect + safe area). tests: every widget under every theme at phone and desktop widths (src/tests/matrix.rs). ships the editor example"
depends = ["engine", "editor", "accord"]


# ---------------------------------------------------------------------------
# workspace crates. the source of truth is Cargo.toml members; this table
# tracks it, not the other way around.
# ---------------------------------------------------------------------------

[crates.engine]
path = "rust/engine"
role = "the gpu-first compositing engine itself (the modules above): rendering, text, layout, input (file drops included), animation, tokens, platform (ime, lifecycle, files: native dialogs behind a trait with a fake, rfd only on desktop; menu: a MenuModel read from a projection, NativeMenu behind a trait with a fake, muda only on desktop; alerts: the system alert and confirmation behind a trait with a fake, rfd MessageDialog only on desktop; tray: a tray icon with a menu from the projection, tray-icon on macOS and windows; notify: a system notification with one action, native answer needs a bundle on macOS; print: the frame as a document at paper scale behind a Printer trait with a fake, CUPS lp and lpstat as children with a deadline on desktop unix; capture: camera and microphone behind a trait with fakes, ffmpeg as a child per device, the newest frame and a 2 s audio ring, permission as state; links: a strict grammar for the app scheme, a link always requested as the agent link, the launch argument as the source until the bundle), gpu images (a stream image: one slot whose pixels change in place, rewritten once per atlas), window (WindowHost per window and Windows by id: several windows, render on demand per window, one GPU context each; sleep: a covered window or a sleeping app asks for no frame and wakes with a new one, Background tells background work the app sleeps); a lib (crate-type cdylib+staticlib+rlib) every app and crate builds on; ships the examples/ demos. the widgets live in comps"

[crates.uigallery]
path = "apps/uigallery"
role = "design-system gallery app: a sidebar tree of three groups (Foundations: theme, typography, icons, effects; Components: one page per comps widget, alphabetical, with placeholder slots for the widgets comps does not have yet and alias pages that share a neighbour's example while noting what their own still lacks; Apps Demo: the todo app, the Surface page (task-69: the todo as a surface materialized from verified plev IR beside the fixed one, both on the todo's dispatcher; it switches the surface between two verified forms and proposes one from an intent by offers::Rules or by the Claude (claude-model, desktop only: asked off the app's thread with Execution::Started, the wait and the cost shown, a cancel that kills the child; view/apps/surface_page/{proposing,asking,page}.rs), its intent field, proposer select, propose and cancel buttons projected capabilities on the same dispatcher, lent by TodoPage::with_dispatcher), the Capture page (task-76 item 10: camera and microphone as toggles only a person turns on, the frame in a stream image, a level meter, the device released when the page is not seen; view/apps/capture, app/capture.rs), app/links.rs follows plev-showcase:// links as the agent link, only on shell.page and shell.theme, with every refusal on screen (task-76 item 6), the Files page (task-76 items 3 and 8: the file dialog, a drop zone and a system alert as capabilities; open_file and warn only for a person, drop_files for anyone), the Silences page (task-69 phases 4a and 4b: the video editor's fixed screen, model::silences and view::apps::silences with jobs (ffmpeg as a child in a worker) and generated::{page} (the intent row, the generated review or comparison beside the fixed screen, frames through screen::Frames, a close)), the message dock, the embedded editor, the ide git workspace, the builder tour); the table is view::pages::PAGES, one module per page under view/{foundations,components,apps}; the template of the official app pattern, framed by engine::widgets::shell::AppShell (full sidebar / rail / drawer by breakpoint, captioned groups that fold); a lib (crate-type lib+cdylib+staticlib) whose app shell (app.rs) exposes per-platform entries run/run_web/android_main/uigallery_ios_main; app/record.rs records the session as the ide does (PLEV_RECORD=1, debug, desktop), the shell routes by WindowId over engine::runtime::window::Windows and D detaches the current page into a second window over the same state (app/detached.rs, view/dispatch/detached.rs; task-76 item 2), the component pages whose widgets project in comps are projected and run through the gallery's dispatcher by one Component trait and a table of 19 panes (view/dispatch/component.rs, task-75 phase 2b; a person's click stays in the widget and the projection follows it; the menu bar leaves them out), the view projects its toasts, modal and context menu too (view/dispatch/overlay.rs) and gives a screen reader what only a reader hears (view/dispatch/reader.rs, task-75 phase 2a), the shell itself is projected (view/dispatch/shell.rs: shell.page, shell.theme, shell.detach, shell.print, shell.save_session; its keys go through the dispatcher) app/menu.rs mounts the native menu bar from the gallery projection (task-76 item 4), app/tray.rs the tray with the shell menu and shell.show, app/notify.rs the notifications of the Files and of a finished detection through a sink (task-76 item 5), app/sleep.rs routes Occluded and suspend/resume so the gallery neither draws nor settles work while asleep and wakes with the state now (task-76 item 7), app/print.rs and view/dispatch/shell/print.rs print the main window's frame at paper scale on a thread of its own (shell.print, a person only, cmd-p; task-76 item 9), app/entry.rs holds the per-platform entries, tool/bench/regress also compares and classifies frames and captures the desktop against itself (regress compare, regress capture; tool/bench/regress/requested.json is the table of requested differences; task-77), app/mirror.rs offers the windows' scenes to watchers of the agent port when the person launches with PLEV_MIRROR=1 and apps/mirroring draws them in another process, live images never crossing (task-79); since task-79 phase 2 the mirror's click goes back as an act through the contract (Viewer::hit over the bindings in stacking order, Hand presses the reader's primary action from its last look, as the agent \"mirror\") and every bound control the port counts as secret (accord::redactor::is_secret, failing closed) is masked before the codec writes the layer (record::scene::Sender::frame_masked, a box that says so), examples/videos drives the video editor demo through the agent port without a window, and tests/fixtures/sessions holds the two recorded demos (task-69 phase 4c); the keyboard on the component pages walks the projection's order with Tab and the WAI-ARIA arrows, lists and tables one row at a time, a modal traps the focus and gives it back (view/dispatch/keyboard.rs, task-75); the input method reaches the Input page's focused field and the Editor, the IME on only while one of them takes it (view/ime.rs, app/events/ime.rs); cmd or ctrl with c, x, v and a go to the focused field's clipboard, a chord never types, and a right-click on an Input field opens its Cut, Copy, Paste and Select all menu, an agent's pick refused (view/clipboard.rs, view/field_menu.rs)"
depends = ["engine", "editor", "accord", "plevir", "screen", "offers", "claude (desktop)", "idestudio (desktop)", "gitdrv (desktop)", "socket (desktop)"]
targets = ["desktop", "web", "android", "ios"]

[crates.urnadbapp]
path = "apps/urnadbapp"
role = ".urna vector-db explorer app (6 tabs: open/overview/search/chunks/graph/stats). own workspace, excluded from the root one because the native backend path-depends on the sibling urna checkout at ../urna, v0.4.0+ (build with --manifest-path apps/urnadbapp/Cargo.toml). same lib+cdylib+staticlib shell shape as showcase (run/run_web/android_main/urnaui_ios_main). native backend = urna-format/urna-runtime (path deps into the sibling urna workspace, read-only) + one memmap2 map for the sections the ui decodes itself (spans, blob overlay 0x16, blob offset table 0x17, graph csr) + worker thread that wakes the winit loop through an EventLoopProxy after every result + offline python embedder bridge (potion for the text slab, the registry embedder per multimodal space) + ffmpeg frame decode of inlined media read in place via its subfile protocol (model/frames, model/subprocess drains pipes with a timeout); native open/save dialogs through engine::runtime::platform::files (task-76 item 3; no rfd of its own), file drops through engine::control::input::FileDrop. surfaces every urna pillar: exact/ann/graph/hybrid/space search with the explain honesty line, validate, media blob list + hash-verified export, urna:// citation resolve, frame previews. web backend = urnaread (portable in-memory reader, no urna deps, accepts the URNA and pre-rename NEST magics) + inline worker, file ingress via a hidden input[type=file]; no embedder, no export, no frames there"
depends = ["engine"]
external-tools = ["ffmpeg (frame previews, optional)", "python3 + urna/python (text search, optional)"]
targets = ["desktop", "web"]

[crates.llmrun]
path = "rust/llmrun"
role = "local language model inference in process: one streaming interface (llmrun::Model: reset, next id greedily, context; llmrun::stream: the decode loop on its own thread, tokens on a tokio channel, cancel, always a final Done or Failed) and two implementations behind features, candle (candle-transformers' llama) and burn (model code adapted from burn-lm, rust/llmrun/NOTICE), on the cpu or the apple gpu (metal); text: the tokenizer, an incremental detokenizer and the chat template; feature plev hands the engine's own device to burn (wgpu 29 on both sides); bin llm-bench measures load, first token, decode rate, memory and binary size. own workspace and Cargo.lock, excluded from the root like urnaui (build with --manifest-path rust/llmrun/Cargo.toml); the weights live outside the repository (PLEV_LLM_MODEL). adr ai-native-single-process"
depends = ["engine (feature plev)", "candle 0.11 (feature candle)", "burn 0.21 (feature burn)", "tokenizers", "tokio"]

[crates.primes]
path = "demo/primes"
role = "prime number creatures particle sandbox (codepen port); seeded sim core (rng/primes/coherence/params) + color (hsl->srgb) + windowed clear skeleton; physics/scene/controls land in later milestones"
depends = ["engine"]
targets = ["desktop", "web"]

[crates.idestudio]
path = "apps/idestudio"
role = "plev-native git client, a lib and two bins: views (three columns: changes, stacks, diff, built from comps over engine::styling::theme), adapters (git types -> view rows), session (GitSession: UiRequest <-> GitCommand/GitEvent, diff target, log/branch caches) and status (the file-status colors, the only app-owned tokens); the workspace takes a frame origin (set_frame) so a host can embed it, which the showcase Git tab does; main.rs is the winit shell (the ide bin). workbench (task-62, adr commit-checks-the-index-it-observed): one Workbench owns the WorkspaceView, the GitSession and a sem Dispatcher, projects the workspace (changes, changes.file[<path>], diff, commit.form, commit.message, commit.submit, stacks, notices) and runs every capability through the dispatcher for every actor; mutations leave for the git worker as Execution::Started and their receipts end at the point of truth (CommitIf checks the real index before git commit); refusals show as toasts, an agent's discard waits for a person in a modal; the ide binary and the showcase Git page hold the same Workbench; an agent reaches the ide binary's (task-86: agent.rs, a wire Host over the Workbench and the frame's visible bindings, opened with PLEV_AGENT=1 in a debug build; the shell serves it on the port's wake and after every git result it applies, and draws only when an act ran), not the showcase Git page (the showcase's port serves only its todo page). main.rs is split: pace.rs (the loop's pacing) and keys.rs (the keymap). record (task-63 phase d): Recording, the ide's flight recorder on the workbench's clock with PLEV_RECORD=1 in a debug build (a sink on the dispatcher, the port's observations through agent::serve_recorded, the state after each change, every frame with its bindings, the person's inputs by kind), saved on cmd-shift-s, on close and on a panic; PLEV_BACKGROUND=1 on macOS opens the window without taking the focus. ide-lab (src/bin/lab, unix only, task-62 phase c) is the laboratory of the experiment: a real repository in a temp dir, the Workbench with no window served through wire's AgentPort as app ide, rec's Recorder on the workbench's clock, a scripted person, arms plev, scripted, git and screenshot, a json report and the session file checked against git; apps/agenteval/tests/experiment.rs runs it in the gate; since task-96 Workbench::host_surfaces puts a column beside the fixed views with an intent line and a SurfaceHost (the ide binary turns it on; tests and the lab choose), the registry from the workspace projection alone (app_snapshot), every act on a surface routed to the capability it stands for and dispatched by the one dispatcher; the rules review commits, the Claude proposes off the thread by the showcase path over a scoped snapshot (only the commits the review names, their files and the diff while it shows one of them); ide-lab --arm review records demo 5 with no window"
