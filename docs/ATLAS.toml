rified again, each with an exact Inverse (the contrary op, or the props, layouts or parent before), no id leaves without hide, an op on a template acts on every item, promote only of an action the registry declares for whoever asked; since task-70 phase 4, transform::Preferences (larger text, more contrast, denser or sparser) turns the person's accessibility preferences into lists of the same Ops by token (emphasize, restyle, density), each verified, over(surface, by, cx) says what applied and what was refused; restyle reaches a slider's, table's and image's ink and a badge's fill; promote on an item template finds the action on the first item that declares it; since task-97 the vocabulary ends with Component::Code (a named region showing lines, a list or a text, and kinds, a list of LineKind names: context, added, removed, header), the verifier unchanged and the schema grown at its end"
