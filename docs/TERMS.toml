[docs]
# a path of the archive before 2026-11 = where that page lives now. <Theme>
# is one of Ecosystem, Importing, Interface, Recording, Rendering, Semantics,
# Structure, Synthesis, Workflows; Research/ adds Exploring, the experiments.
"docs/adr/<theme>/NNNN-<slug>.md" = "docs/adr/<Theme>/NNNN-<slug>/NNNN-<slug>.md"
"docs/adr/generated/" = "docs/adr/Synthesis/"
"docs/adr/README.md" = "docs/adr/adr.md"
"docs/tasks/<task>/README.md" = "docs/Tasks/<task>/<task>.md"
"docs/tasks/README.md" = "docs/Tasks/Tasks.md"
"docs/experiments/<slug>/README.md" = "docs/Research/Exploring/<slug>.md"
"docs/research/<name>.md" = "docs/Research/<Theme>/<name>.md"
"docs/research/README.md" = "docs/Research/Research.md"
"docs/ref/architecture/<name>.md" = "docs/Research/<Theme>/<name>.md"
"docs/ref/operations/<name>.md" = "docs/Research/Workflows/<name>.md"
"docs/ref/platforms/<name>.md" = "docs/Research/<Theme>/<name>.md"
"docs/learnings/general.md" = "split beside the ADRs its entries speak to (docs/adr/<Theme>/NNNN-<slug>/learned-<slug>.md); the way of working in docs/Research/Workflows/autonomous-cycle-learnings.md"
"docs/learnings/<name>.md" = "docs/adr/<Theme>/NNNN-<slug>/<name>.md, beside the decision it led to"
"docs/img/task-69-checkpoint-b/" = "docs/Tasks/task-69-ephemeral-generative-surfaces/img/"

[root]
# a path at the root that changed = where it lives now
".devops/check/lychee.toml" = ".config/lychee.toml"
".devops/check/nextest.toml" = ".config/nextest.toml"
".devops/check/typos.toml" = ".config/typos.toml"
".devops, .secops, .design" = "removed from the root in 2026-11 (docs/adr/Structure/0091-tool-contracts-live-in-config)"

[tests]
# since task-106 the files under a crate's tests/ are modules of one test
# target, `suite` (docs/adr/Workflows/0087-a-crates-integration-tests-are-one-executable).
# a command an older page gives with a file's name reads, today:
"cargo test -p <crate> --test <file>" = "cargo test -p <crate> --test suite <file>::"
"cargo test -p <crate> --test <file> <name>" = "cargo test -p <crate> --test suite <file>::<name>"
# the targets that kept their own name: edit_literal (uigallery), device_loss
# and text_audit (engine), rerun (idestudio), gate_bytes (motion), session
# (record), queries (replay), ui (inspector), and the five of tool/tests.
