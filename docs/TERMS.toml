# the names of the tree. the 2026-10 reorganization (migration.toml in the
# history of the branch that made it) renamed crates and moved modules; this
# glossary says, for every name that changed, what it is called now and
# where it lives. older pages under docs/Tasks, docs/adr and docs/Research keep the names of their time;
# [docs] says where a path of the archive that an old page or commit cites lives now,
# [root] the same for a path at the root, and [tests] how a test command of
# an older page is written since a crate's tests became one executable.

[crates]
# former name = { now = "<package>", at = "<directory>" }
sem = { now = "accord", at = "rust/accord" }
uir = { now = "plevir", at = "rust/plevir" }
surface = { now = "screen", at = "rust/screen" }
propose = { now = "offers", at = "rust/offers" }
claude-model = { now = "claude", at = "rust/claude" }
wire = { now = "socket", at = "rust/socket" }
rec = { now = "record", at = "rust/record" }
inspect = { now = "replay", at = "rust/replay" }
monster = { now = "motion", at = "rust/motion" }
lot = { now = "import", at = "rust/import (formats::lottie)" }
svg = { now = "import", at = "rust/import (formats::svg)" }
parser = { now = "import", at = "rust/import" }
rope = { now = "editor", at = "rust/editor" }
git = { now = "gitdrv", at = "rust/gitdrv" }
narrate = { now = "markup", at = "rust/markup" }
narrate-macro = { now = "macros", at = "rust/macros (markup)" }
macros = { now = "macros", at = "rust/macros (view)" }
comps = { now = "engine", at = "rust/engine (widgets)" }
engine = { now = "engine", at = "rust/engine" }
llm = { now = "llmrun", at = "rust/llmrun" }
showcase = { now = "uigallery", at = "apps/uigallery" }
ide = { now = "idestudio", at = "apps/idestudio" }
"ide-lab (bin of ide)" = { now = "agenteval", at = "apps/agenteval" }
inspector = { now = "inspector", at = "apps/inspector" }
urnaui = { now = "urnadbapp", at = "apps/urnadbapp" }
prime = { now = "primes", at = "demo/primes" }
"showcase example mirror" = { now = "mirroring", at = "apps/mirroring" }
"showcase example measure" = { now = "measure", at = "tool/bench/measure" }
"showcase example regress" = { now = "regress", at = "tool/bench/regress" }

[demos]
