# plev architecture, one file. the machine map, the human reference and the
# frame-flow diagram used to be three files (arc.yaml, arc.md, arc.mmd);
# they live here now, in this order: map, then prose, then the diagram.
# agents read the map at task start; humans read the prose; the diagram is
# mermaid inside a literal string, paste it into any mermaid renderer.
# update this file with any structural change. crates/engine/tests/
# arc_sync_guard.rs fails the build if a workspace crate or an example is
# missing here.

[project]
name = "plev"
kind = "gpu-first compositing engine"
language = "rust (edition 2024)"
stack = ["wgpu 28", "winit 0.30", "cosmic-text 0.18", "taffy 0.9", "lyon"]

[project.targets]
shipping = ["macos-metal", "web-webgpu"]
# android + ios both run the showcase (apk via GameActivity; ios on the
# simulator via a thin objc shell). see [platform-apps].
in-progress = ["android-vulkan", "ios-metal"]
pending = ["linux-vulkan", "windows-d3d12"]

[layout]
# the engine is a crate, crates/engine; the root is a virtual workspace.
# apps and libraries are sibling crates; demos are the engine's examples
# (adr workspace-engine-at-root-libs-in-crates-demos-in-examples).
root = "virtual workspace (Cargo.toml = members + workspace.package/deps/lints/profiles only)"
engine = "crates/engine"
knowledge = "docs (adr + arc + how-to + mission + refs; this file lives at docs/arc/arc.toml)"
web = "web (Trunk.toml + index.html + dist output; script/web is the dev loop; web/urnaui + script/web-urnaui for the urnaui target)"
scripts = "script (gate = the four-part gate, web = trunk dev loop, web-urnaui = urnaui trunk dev loop on :8081)"
contracts = ".contracts (.agents/AGENTS.md instruction source; .mantras/.code/.lang/.rust tool configs + conventions)"

# ---------------------------------------------------------------------------
# the engine's internal layers, under crates/engine/src, bottom up.
# ---------------------------------------------------------------------------

[modules.gpu]
path = "crates/engine/src/gpu"
role = "wgpu device/surface/pipelines; srgb view formats; image atlas; GpuVec buffers (vec); texture_pool; wgsl shaders (gpu/shaders)"
contracts = ["srgb-view-formats", "surface_render_view-only"]

[modules.compositor]
path = "crates/engine/src/compositor"
role = "scene nodes, layers with dirty hashes, resolve to gpu buffers; the semantic binding table beside the scene (task-59, adr semantic-binding-beside-the-scene): bind/bind_to_layer record SemId -> Binding { rect, layer, clip read from the layer's own clip nodes, order, view } per frame, never part of a layer hash; hit(x, y) returns the topmost bound id"
depends = ["gpu", "sem"]

[modules.text]
path = "crates/engine/src/text"
role = "cosmic-text shaping, gpu glyph atlas (rasterized at the hidpi raster scale, warns once per non-embedded font), TextMeasurer (the only width source)"
depends = ["gpu"]
contracts = ["one-textstyle-measure-and-draw", "glyphs-rasterize-at-raster-scale-hidpi", "warn-once-on-non-embedded-font"]

[modules.path]
path = "crates/engine/src/path"
role = "lyon tessellation behind PathBuilder"
contracts = ["auto-finish-open-subpaths"]

[modules.layout]
path = "crates/engine/src/layout"
role = "taffy wrapper: flex, percent, text measure functions"
depends = ["text"]

[modules.input]
path = "crates/engine/src/input"
role = "pointer state, hit regions, touch tracker + gesture recognizer, touch-to-pointer synth, scroll, dispatch. InputState and its hit regions run only in engine::window::App and the builder; the shells that ship hand pointer events straight to their view (the showcase, as comps::WidgetEvent) or workbench (the ide), which hit-tests with the rects it draws (crates/showcase/src/app.rs, crates/ide/src/main.rs)"

[modules.animation]
path = "crates/engine/src/animation"
role = "Tween, Spring, FrameClock, easing (dt-based; web_time); set_reduced_motion holds the system's reduce motion per thread (task-75 phase 1): on, a spring lands and a finite tween completes on the next tick, a tween repeating forever runs on; a thread starts with it off, so tests and baselines never see a person's setting"

[modules.perf]
path = "crates/engine/src/perf"
role = "PerfMonitor: rolling windows over AnimationTick + RenderStats (fps, dt p50/p95/p99, cpu micros, memory incl. native rss); PerfHud overlay layer; opt-in via RenderConfig (perf_log, perf_hud); gpu timestamp queries pending (gpu_micros stays None). perf::stages (task-73 phase 1): per-frame, per-thread cost by stage (projection, scene build, measure hit/miss, shaping, bind, hit test, layer hash, geometry, text resolve, upload bytes, encode, gpu wait), off by default and one relaxed load when off; crates/showcase/examples/measure drives nine interactions through the frame path and prints the tables (docs/mission/steps/ongoing/task-73-measurements.md); RenderConfig::gpu_timestamps (off by default, no device feature when off) adds timestamp queries around the layer and composite passes of draw_frame, read a frame late, as the GpuSpan/GpuLayers/GpuComposite stages and PerfMonitor::record_gpu_micros (task-73 phase 1b)"
depends = ["animation", "compositor", "text"]
contracts = ["pure-no-gpu", "hud-implies-continuous-frames"]

[modules.signal]
path = "crates/engine/src/signal"
role = "reactive primitives (experimental: no new app code without an adr, see official-app-pattern)"

[modules.window]
path = "crates/engine/src/window"
role = "App runner: event loop, render-on-demand, render passes, wasm canvas; draw_frame draws a built scene into any srgb view (resolve, text, images, layer passes, composite, submit) and present_frame is acquire + draw_frame + present, the shared path every app (showcase, ide, urnaui) goes through (adr headless-render-shares-the-frame-path)"
depends = ["gpu", "compositor", "text", "input"]

[modules.effects]
path = "crates/engine/src/effects"
role = "EffectProcessor: the blur, shadow and composite pipelines and the passes that run them over pooled textures. draw_frame uses its two-pass blur for backdrop-blur nodes and composites with no per-layer effect (&[]); only engine::window::App's own frame tail (window/render.rs) applies the per-layer blur and shadow"
depends = ["gpu"]

[modules.actions]
path = "crates/engine/src/actions"
role = "zed-style key bindings: Keystroke, KeyContext and ContextStack, the json Keymap and KeymapMatcher resolve a key to an action name, ActionRegistry builds the boxed Action. it knows nothing of sem: no binding names a capability; the ide sends the keys that act on one through its Workbench"

[modules.accessibility]
path = "crates/engine/src/accessibility"
role = "behind the accessibility feature (on by default; task-60, adr accessibility-projects-the-semantic-snapshot): tree::build projects a sem Snapshot into an AccessKit tree placed by the compositor's bindings, NodeIds follow each SemId across frames, role maps sem roles, action::translate turns a screen reader's request into a sem Request with Actor::Assistive for the app's dispatcher, focus::next walks the snapshot's focus order (called only by a test today); Bridge (native only) attaches accesskit_winit to a hidden window, used by the showcase shell and engine::window::App; since task-75 phase 1 (adr accessibility-is-production-ready-per-platform) a Status is a polite live region and an Alert an assertive one, the words its value (its own, else its message state, else its label), the focus untouched; a button, link or menu item with one action without a parameter is pressed by it; a group that names and does nothing is a GenericContainer; motion reads the system's reduce motion (macOS: /usr/bin/defaults, when the bridge attaches and when the window takes the focus; None elsewhere) into animation::set_reduced_motion"
depends = ["compositor", "sem"]

[modules.headless]
path = "crates/engine/src/headless"
role = "native only: svg::export writes the scene as SVG (one element per node in composite and push order, text as the outlines of the glyphs the frame shaped through TextSystem::shaped_glyphs, every approximation reported per node, task-66b, adr svg-export-reads-the-scene); Renderer over GpuContext::new_headless (no surface, Rgba8UnormSrgb, same from_device pipelines as a window) drawing through window::draw_frame into an offscreen texture; read_texture with 256-byte row padding; Frame -> png through the image crate; typed HeadlessError; None when there is no adapter so tests skip. showcase --render and monster_player --frame use it; text::probe renders through it (task-66)"
depends = ["gpu", "compositor", "text", "window"]

[modules.hot_reload]
path = "crates/engine/src/hot_reload"
role = "desktop debug builds only (cfg(hot_reload) from build.rs, feature on by default): shader watcher owned by GpuContext (a saved .wgsl swaps its pipeline, wakes the loop via request_redraw, every layer redraws); literal reload (a saved .rs whose only change is strings or hex colors is applied in place at TextNodeKey, TextMeasurer, push_to_layer and the clear color, state intact; baseline = the sources at process start, skeleton hash + literal list per file via proc-macro2); code changes rebuild (cargo build -p $CARGO_PKG_NAME) and exec the fresh binary; narrate DSL override map (experimental, polled by window::App only)"
depends = ["gpu", "compositor", "text", "effects"]
contracts = ["never-in-release-wasm-mobile", "state-preserved-on-literal-reload"]

[modules.theme]
path = "crates/engine/src/theme"
role = "the design tokens: measured hoff colors + glass recipe, typography ramp, spacing, radius ladder + shape roles, control sizes, container sizes, durations, layout breakpoints/gutters/sidebar mode, shadow stacks by elevation, intents, oklch tooling; hoff dark + hoff light + hoff core (the typescript kit: nine shades, six accents, depths, Inter, plus theme.button: a recipe per button variant and state, the tailwind class lists as tokens) + 11 named palettes. every widget in crates/comps reads from here; no widget restates a number"

[modules.graph]
path = "crates/engine/src/graph"
role = "graph model + force layout + view transform (the pan/zoom widget is comps::graph::GraphView)"

[modules.clipboard]
path = "crates/engine/src/clipboard"
role = "the one clipboard entry point: ClipboardProvider trait, SystemClipboard (arboard, desktop) and LocalClipboard (tests, wasm, mobile)"

[modules.builder]
path = "crates/engine/src/builder"
role = "declarative element tree (div/text/button) -> layout -> emit; supported for prototypes and demos"
depends = ["layout", "text"]

[modules.component]
path = "crates/engine/src/component"
role = "Lifecycle trait (experimental, see official-app-pattern)"

[modules.view]
path = "crates/engine/src/view"
role = "View trait + ViewContext (experimental, see official-app-pattern)"

[modules.platform]
path = "crates/engine/src/platform"
role = "safe areas (mod), ime, app lifecycle"

# ---------------------------------------------------------------------------
# workspace crates. the source of truth is Cargo.toml members; this table
# tracks it, not the other way around.
# ---------------------------------------------------------------------------

[crates.engine]
path = "crates/engine"
role = "the gpu-first compositing engine itself (the modules above): rendering, text, layout, input (file drops included), animation, tokens, platform (ime, lifecycle, files: native dialogs behind a trait with a fake, rfd only on desktop; menu: a MenuModel read from a projection, NativeMenu behind a trait with a fake, muda only on desktop; alerts: the system alert and confirmation behind a trait with a fake, rfd MessageDialog only on desktop; tray: a tray icon with a menu from the projection, tray-icon on macOS and windows; notify: a system notification with one action, native answer needs a bundle on macOS; print: the frame as a document at paper scale behind a Printer trait with a fake, CUPS lp and lpstat as children with a deadline on desktop unix; capture: camera and microphone behind a trait with fakes, ffmpeg as a child per device, the newest frame and a 2 s audio ring, permission as state; links: a strict grammar for the app scheme, a link always requested as the agent link, the launch argument as the source until the bundle), gpu images (a stream image: one slot whose pixels change in place, rewritten once per atlas), window (WindowHost per window and Windows by id: several windows, render on demand per window, one GPU context each; sleep: a covered window or a sleeping app asks for no frame and wakes with a new one, Background tells background work the app sleeps); a lib (crate-type cdylib+staticlib+rlib) every app and crate builds on; ships the examples/ demos. the widgets live in comps"

[crates.comps]
path = "crates/comps"
role = "the plev design system: every widget, recipe, icon, chart, overlay and the editor, one crate over the engine, every visual value read from engine::theme::Theme (docs/catalog.md is the inventory). categories: core (Rect/WidgetEvent/EventResult, color helpers), wake (Wake: what a tick asks of the loop, a frame now and the deadline of the next, merged by earliest; Blink: the caret clock the text widgets share; task-82, adr a-tick-asks-for-a-deadline), recipe (glass pill/surface, edge light, inset key-light, shadow stacks, focus ring), icons (lucide set), action (button, icon button, chip, badge), form (text field over the text_input core, checkbox, switch, slider, select), nav (tabs, nav link, sidebar by breakpoint, panel header, breadcrumb, split pane), content (card, avatar, panel, stat, code block, skeleton, table, empty state, virtual list, tree, separator), feedback (modal, context menu, toast, tooltip, progress, spinner, scrollbar), overlay (the overlay stack with spring motion), charts (geometry + draw), graph (GraphView), editor (rope-backed multi-cursor editor view), shell (AppShell: sidebar + header + content rect + safe area). tests: every widget under every theme at phone and desktop widths (src/tests/matrix.rs). ships the editor example"
depends = ["engine", "rope", "sem"]

[crates.showcase]
path = "crates/showcase"
role = "design-system gallery app: a sidebar tree of three groups (Foundations: theme, typography, icons, effects; Components: one page per comps widget, alphabetical, with placeholder slots for the widgets comps does not have yet and alias pages that share a neighbour's example while noting what their own still lacks; Apps Demo: the todo app, the Surface page (task-69: the todo as a surface materialized from verified plev IR beside the fixed one, both on the todo's dispatcher; it switches the surface between two verified forms and proposes one from an intent by propose::Rules or by the Claude (claude-model, desktop only: asked off the app's thread with Execution::Started, the wait and the cost shown, a cancel that kills the child; view/apps/surface_page/{proposing,asking,page}.rs), its intent field, proposer select, propose and cancel buttons projected capabilities on the same dispatcher, lent by TodoPage::with_dispatcher), the Capture page (task-76 item 10: camera and microphone as toggles only a person turns on, the frame in a stream image, a level meter, the device released when the page is not seen; view/apps/capture, app/capture.rs), app/links.rs follows plev-showcase:// links as the agent link, only on shell.page and shell.theme, with every refusal on screen (task-76 item 6), the Files page (task-76 items 3 and 8: the file dialog, a drop zone and a system alert as capabilities; open_file and warn only for a person, drop_files for anyone), the Silences page (task-69 phases 4a and 4b: the video editor's fixed screen, model::silences and view::apps::silences with jobs (ffmpeg as a child in a worker) and generated::{page} (the intent row, the generated review or comparison beside the fixed screen, frames through surface::Frames, a close)), the message dock, the embedded editor, the ide git workspace, the builder tour); the table is view::pages::PAGES, one module per page under view/{foundations,components,apps}; the template of the official app pattern, framed by comps::shell::AppShell (full sidebar / rail / drawer by breakpoint, captioned groups that fold); a lib (crate-type lib+cdylib+staticlib) whose app shell (app.rs) exposes per-platform entries run/run_web/android_main/showcase_ios_main; app/record.rs records the session as the ide does (PLEV_RECORD=1, debug, desktop), the shell routes by WindowId over engine::window::Windows and D detaches the current page into a second window over the same state (app/detached.rs, view/dispatch/detached.rs; task-76 item 2), the shell itself is projected (view/dispatch/shell.rs: shell.page, shell.theme, shell.detach, shell.print, shell.save_session; its keys go through the dispatcher) app/menu.rs mounts the native menu bar from the gallery projection (task-76 item 4), app/tray.rs the tray with the shell menu and shell.show, app/notify.rs the notifications of the Files and of a finished detection through a sink (task-76 item 5), app/sleep.rs routes Occluded and suspend/resume so the gallery neither draws nor settles work while asleep and wakes with the state now (task-76 item 7), app/print.rs and view/dispatch/shell/print.rs print the main window's frame at paper scale on a thread of its own (shell.print, a person only, cmd-p; task-76 item 9), app/entry.rs holds the per-platform entries, examples/regress also compares and classifies frames and captures the desktop against itself (regress compare, regress capture; fixtures/determinism/requested.json is the table of requested differences; task-77), app/mirror.rs offers the windows' scenes to watchers of the agent port when the person launches with PLEV_MIRROR=1 and examples/mirror draws them in another process, live images never crossing (task-79), examples/demo drives the video editor demo through the agent port without a window, and fixtures/demo holds the two recorded demos (task-69 phase 4c)"
depends = ["engine", "comps", "rope", "sem", "uir", "surface", "propose", "claude-model (desktop)", "ide (desktop)", "git (desktop)", "wire (desktop)"]
targets = ["desktop", "web", "android", "ios"]

[crates.urnaui]
path = "crates/urnaui"
role = ".urna vector-db explorer app (6 tabs: open/overview/search/chunks/graph/stats). own workspace, excluded from the root one because the native backend path-depends on the sibling urna checkout at ../urna, v0.4.0+ (build with --manifest-path crates/urnaui/Cargo.toml). same lib+cdylib+staticlib shell shape as showcase (run/run_web/android_main/urnaui_ios_main). native backend = urna-format/urna-runtime (path deps into the sibling urna workspace, read-only) + one memmap2 map for the sections the ui decodes itself (spans, blob overlay 0x16, blob offset table 0x17, graph csr) + worker thread that wakes the winit loop through an EventLoopProxy after every result + offline python embedder bridge (potion for the text slab, the registry embedder per multimodal space) + ffmpeg frame decode of inlined media read in place via its subfile protocol (model/frames, model/subprocess drains pipes with a timeout); native open/save dialogs through engine::platform::files (task-76 item 3; no rfd of its own), file drops through engine::input::FileDrop. surfaces every urna pillar: exact/ann/graph/hybrid/space search with the explain honesty line, validate, media blob list + hash-verified export, urna:// citation resolve, frame previews. web backend = urnaread (portable in-memory reader, no urna deps, accepts the URNA and pre-rename NEST magics) + inline worker, file ingress via a hidden input[type=file]; no embedder, no export, no frames there"
depends = ["engine", "comps"]
external-tools = ["ffmpeg (frame previews, optional)", "python3 + urna/python (text search, optional)"]
targets = ["desktop", "web"]

[crates.prime]
path = "crates/prime"
role = "prime number creatures particle sandbox (codepen port); seeded sim core (rng/primes/coherence/params) + color (hsl->srgb) + windowed clear skeleton; physics/scene/controls land in later milestones"
depends = ["engine"]
targets = ["desktop", "web"]

[crates.ide]
path = "crates/ide"
role = "plev-native git client, a lib and two bins: views (three columns: changes, stacks, diff, built from comps over engine::theme), adapters (git types -> view rows), session (GitSession: UiRequest <-> GitCommand/GitEvent, diff target, log/branch caches) and status (the file-status colors, the only app-owned tokens); the workspace takes a frame origin (set_frame) so a host can embed it, which the showcase Git tab does; main.rs is the winit shell (the ide bin). workbench (task-62, adr commit-checks-the-index-it-observed): one Workbench owns the WorkspaceView, the GitSession and a sem Dispatcher, projects the workspace (changes, changes.file[<path>], diff, commit.form, commit.message, commit.submit, stacks, notices) and runs every capability through the dispatcher for every actor; mutations leave for the git worker as Execution::Started and their receipts end at the point of truth (CommitIf checks the real index before git commit); refusals show as toasts, an agent's discard waits for a person in a modal; the ide binary and the showcase Git page hold the same Workbench; an agent reaches the ide binary's (task-86: agent.rs, a wire Host over the Workbench and the frame's visible bindings, opened with PLEV_AGENT=1 in a debug build; the shell serves it on the port's wake and after every git result it applies, and draws only when an act ran), not the showcase Git page (the showcase's port serves only its todo page). main.rs is split: pace.rs (the loop's pacing) and keys.rs (the keymap). record (task-63 phase d): Recording, the ide's flight recorder on the workbench's clock with PLEV_RECORD=1 in a debug build (a sink on the dispatcher, the port's observations through agent::serve_recorded, the state after each change, every frame with its bindings, the person's inputs by kind), saved on cmd-shift-s, on close and on a panic; PLEV_BACKGROUND=1 on macOS opens the window without taking the focus. ide-lab (src/bin/lab, unix only, task-62 phase c) is the laboratory of the experiment: a real repository in a temp dir, the Workbench with no window served through wire's AgentPort as app ide, rec's Recorder on the workbench's clock, a scripted person, arms plev, scripted, git and screenshot, a json report and the session file checked against git; crates/ide/tests/lab.rs runs it in the gate"
depends = ["git", "engine", "comps", "sem", "wire (ide-lab only)", "rec (ide-lab only)"]

[crates.rope]
path = "crates/rope"
role = "rope/transactions/multi-cursor/history, pure (no ui)"

[crates.sem]
path = "crates/sem"
role = "the semantic contract (task-57, adr semantic-contract-as-pure-projection): SemId, the persistent logical identity of a control (canonical text, chosen by the app or the IR, never positional), Role, Value under StateKey, StateRef <semid>:<key>, Constraints (secret keeps only a length; redact is the one rule that reduces a request, a stage or a stale delta aimed at a secret node to lengths, shared by wire and rec, task-57b), ActionDecl with its reads and Policy, Node with inherited inert and a track_caller Source; the app implements Semantics::project, called on demand from live state, and SnapshotBuilder::finish reports every violation at once; Snapshot (projection order, children, roots, value, subtree) has a stable Revision (FNV-1a 64 over a documented encoding, tree order, source excluded) and Snapshot::diff -> Change, empty exactly when two snapshots are equal; pure (no gpu, no window, no text stack), serde behind a default feature. actions (task-58, adr actions-carry-observed-state): Request::observe carries the values the actor saw for the action's reads; check (pure) decides in a fixed order (not found, unknown action, not authorized, stale, inert, disabled, invalid param, needs confirmation, accepted), stale compares only the reads and returns one StateChanged per read that moved; one Dispatcher for human, agent, assistive and test projects the Operable app at dispatch, executes only after accepted or a person confirmed (at the screen or through assistive technology), passing the RequestId to execute, and keeps a Receipt whose Stages walk the legal transitions with caller-passed Millis (async complete/fail, reject_at_truth for the second check at the point of truth), ReceiptSinks see every stage, finished receipts bounded by retention; examples/commit.rs runs the thesis scenario; SnapshotBuilder::declared and reopen let a projection add to nodes declared earlier (task-70 phase 3, composites)"

[crates.rec]
path = "crates/rec"
role = "the session flight recorder (task-63, adr session-recording-replay-not-reexecution): Recorder records a session as data, never as video; a Sink per dispatcher (sem::ReceiptSink) records every stage of every receipt with its request (shared by its stages, redacted through sem::redact: a param, observed value, stale delta, outcome or error aimed at a secret field keeps only its length, and an unknown target counts as secret), explicit calls record observations (actor, scope, revision), the app's snapshots (whole on the cadence and when nodes are added, moved or reordered, sem Changes in between, unchanged ones not stored) and a person's input (kind and bound SemId, never the content); every time is the caller's, never a clock; the visual track takes one frame per rendered frame (Recorder::frame reads the visible compositor layers in composite order), raises it with monster::raise into the open chunk, and a chunk closes on its cadence into monster::discover + encode (a v0 file with an empty asset table, chunk-local u16 asset ids, frame times kept), its assets held once per content and dropped with the last chunk using them; one ring over both tracks, bounded by max_age and max_bytes, cuts only at keyframes (a full snapshot, a chunk start); Session is the read side (events by time, State at t with the projected source kept, receipts touching a SemId up to t, the frame on screen at t played back with MonsterPlayer, the semantic track read without decoding a frame) and holds no dispatcher and no app, so replay never creates a request; the session file is a .monster with magic MONS (an animation keeps MON0; probe dispatches on the magic): a header with the build identity (crate version, git sha from build.rs) and the start, a section index with u64 offsets and a sha256 each, S (json lines of rec::Event), I (chunk index), C (chunks as the exact bytes monster::encode wrote), A (assets: rec's own text payload, paths through monster::asset_path, images as size plus pixels when known); Recorder::persist and export (from the governing keyframe of each track, chunks verbatim, only referenced assets), Session::open and from_bytes strict with typed FileError, install_panic_hook persists the window on a panic and chains the previous hook; since task-63 phase d each frame also records the visible rect of every bound control (section B, session version 1, version 0 still read; Session::bindings_at, binding_at, hit_at)"
depends = ["sem", "monster", "engine"]

[crates.inspect]
path = "crates/inspect"
role = "the session inspector (task-64 phase a, adr the-inspector-reads-a-session-never-runs-it): Inspector borrows a rec::Session and answers the thesis questions about it, by time, without running anything (no app, nothing that dispatches, only the session's read side); timeline: every event summarized with its time from the start, tallied by kind and by actor; why(origin, id): the causal chain of a request: the last observation by its actor at the revision it carries (or not recorded, and why: no observation by that actor, or only at other revisions; and the last instant the recorded state had that revision), the request with the values it read and whether a scoped observation served them, every change of those values between the observation and the request by the state after each event (not by time, so a same-millisecond effect of the request is never before it) with the receipts that ran (executing, completed or failed; a refused one ran nothing) between the state before the change and the change, by correlation in time and never by a declared write (none: from outside the app; two or more: ambiguous, all shown), a person's input in that stretch, the stages, and how it ended (outcome, the refusal with its delta and acted, the failure, or open); control(id, t): the node the recorded state holds at t (role, label, state, the source the app projected it from, beside the build's git sha) and every request that touched it up to t (its target, or a state it read), each with its why as the window up to t tells it; summary: the build, the span, the actors, every request with how it ended, every refusal with its why; text renders each answer as plain english, one labelled line per question of the thesis, every model type is Serialize; the plev-inspect binary (plev-inspect <session.monster> [--timeline] [--why <id> [--origin <n>]] [--control <id> [--at <ms from the start>]] [--json]; the file alone is the summary; exit 0 answered, 1 no such request, 2 bad invocation, 3 the file does not read as a session, the rec FileError said as it is)"
depends = ["rec", "sem"]

[crates.wire]
path = "crates/wire"
role = "the agent surface (task-61, adr agents-act-through-the-semantic-contract): protocol v1 as json lines, every message with v 1, an id the client picks and a type; hello names the connection's actor (sem Actor::Agent), observe {scope, keys, since, bounds, source} answers a snapshot (the nodes in sem's lean serde form, without each node's source unless asked, the whole snapshot's revision) or a delta (sem Changes since a served revision), act {target, action, param, observed or from_revision} answers one stage message per receipt stage (a terminal one carries the revision the app is at, served into the ring, task-87), confirm and decline are refused for agents, typed errors (bad_version, bad_message, unknown_revision, not_enabled); the messages, the codec, the Ring of the last N served whole snapshots (since rebuilds a delta, from_revision rebuilds the observed values with Request::observe, out of the ring is unknown_revision; observations and terminal stages both serve into it) and Server (the protocol against an app with no transport, reaching it only through Host: project, bounds, dispatch through its one dispatcher, add_sink, and observed, told of each observation served, empty by default, task-62 phase c; stages forwarded only to the connection that asked, later ones included; a value aimed at a secret node leaves as its length, an unknown node counts as secret) are pure and compile for wasm; Traffic counts what went through one port (connections, messages and bytes each way, snapshot and delta observations, acts, stages out, stale refusals, errors), read by the app through AgentPort::traffic. unix only: AgentPort (off unless PLEV_AGENT=1 in a debug build, or the app calls open; $TMPDIR/plev/<app>-<pid>.sock, dir 0700, socket 0600, removed on drop; an accepting thread and a reader and a writer per connection only decode and queue, and wake the loop through the shell's closure; drain(host) serves on the app's thread; bounded queues, lines of at most 1 MiB, 16 connections, a client that does not read is cut off) and Client; the plev binary (plev observe [--scope --keys --since --bounds], plev act <target> <action> [--from-revision --param], --app by name or socket path, json lines out, exit 0 observed or completed, 1 rejected, 2 failed, 3 error). the showcase opens the port in its desktop shell beside the accessibility bridge, wakes on UserEvent::Agent and draws only when an act ran, and serves the active page through the hooks assistive technology uses (ShowcaseView::semantics, act, add_sink), bounds from the frame's bindings. the ide-lab opens the port too, over the ide's Workbench, and is the one Host that implements observed (it records each observation)"
depends = ["sem"]

[crates.uir]
path = "crates/uir"
role = "the plev IR (task-68, adr plev-ir-typed-and-verified): a surface described by meaning that a person, an LLM, an importer or a tool proposes and only the verifier admits; Ir (plev_ir 1) holds a Surface of IrNodes, each with a SemId, an optional Component of the closed vocabulary (the comps widgets and the builder's text and image, declared as data in Spec: role, container, how it is named, the state it shows, the events it sends; without one a node is a layout container), Props by theme token (spacing, typography, colors, elevation, control size, shape), Layout (stack, grid, split, overlay) and Size by token, Bind of shown state to StateRefs and of events to CapabilityRefs, and a Repeat of a template over a List or Set whose ids carry [{item}]; one reader (decode, also Ir's Deserialize) reports every shape error at its JSON pointer; Capabilities::from_snapshot is the registry of an app's projection (every StateRef with its ValueKind, every ActionDecl with its ParamSpec, Policy and label), never a second declaration; verify(ir, caps, GenerationPolicy) is the only way to a VerifiedIr (no public constructor, no Deserialize; it carries the focus order) and returns every IrError at once, each with its rule (schema, identity, vocabulary, state, action, policy, access, limits), pointer and reason; the default policy has an agent as author, 256 nodes, depth 16, 256 characters; schema() builds the JSON schema from the same tables and schema/plev-ir-1.json is it written out; the fixtures verify against the ide's and the showcase todo's real projections, which crates/ide/tests/uir_fixture.rs and crates/showcase/tests/uir_fixture.rs write; pure (sem, serde, serde_json), compiles for wasm; transform (task-70 phase 1, adr adaptive-transforms-preserve-identity): nine operations as data (Op, serde tagged by op: hide, show, group, reorder, emphasize, density, restyle, swap_view, promote) over an Adapted (the VerifiedIr and the nodes set aside by hide), each result verified again, each with an exact Inverse (the contrary op, or the props, layouts or parent before), no id leaves without hide, an op on a template acts on every item, promote only of an action the registry declares for whoever asked"
depends = ["sem"]

[crates.surface]
path = "crates/surface"
role = "surfaces materialized from verified plev IR (task-69, adr materialized-surfaces-from-verified-ir): Surface::materialize(VerifiedIr, &Snapshot) is the only way in (no API takes an Ir); the IR unrolls over the app's live state (a repeat once per item of its List or Set, each instance's ids and bindings keyed by the item, an item a List repeats taken once) into a tree of retained comps widgets indexed by SemId; layout by engine::layout::LayoutEngine (stack a flex row or column, grid a wrapping row from min_col, split two panes weighted by the ratio, overlay one pass per layer), every token on its Theme field by an exhaustive match (a button's control_size mapped onto its own ButtonSize ladder); sync reads the bindings again when the app's revision moves and keeps that snapshot as the one shown; render draws each node on its widget (a card on comps' Panel) and binds every projected node to the rect it draws and hit-tests with; project declares the surface as a Region with its nodes, roles by uir::role_of, labels (an instance by its item), the bound state, one action per bound event with the capability's param, policy, enabled and reads (as the surface shows them where a node binds them), into the builder that holds the app's own projection; a widget event is a sem::Request for the bound capability by Actor::Human, observed on the snapshot shown, through the app's dispatcher (the Dispatch trait); route turns an actor's act on a surface node into that capability, its observation named back by the app's state; SurfaceHost keeps the open surfaces; it never executes anything; SurfaceHost::apply(id, Op, Actor, app, policy) and undo keep each small transformation with its inverse and who asked (Change), reconciled by SemId as a whole new form is; a whole new form ends that history (task-70 phase 1); the host keeps the policy each surface was verified under (open_under, transform_under) and applies one request's operations all or none (apply_all), undo_asked taking the whole request back; stat grows by its typography and badge fills by its background (task-70 phase 2)"
depends = ["uir", "sem", "engine", "comps"]

[crates.propose]
path = "crates/propose"
role = "proposers of plev IR (task-69 phase 3a, adr proposers-propose-the-runtime-verifies): the Proposer trait takes an Ask (the intent in text, the app's uir::Capabilities, its sem::Snapshot, the VerifiedIr of the surface it shows, the GenerationPolicy) and answers an unverified uir::Ir or a ProposeError; propose_verified verifies it against the same registry and policy and is the only way out, a VerifiedIr or the reasons; Rules, deterministic, reads a small grammar in english and portuguese (add, filter, counts, compact, two columns, everything) and binds by the registry's structure (a text_input's text state, its text-parameter action and the one without a parameter, or a button beside it; the options of a choice as chips; each int or num state as a stat), never by an app's names; the other words of an intent must be the app's own (labels, id names and keys, state keys) and choose among them, an unknown word is an error listing the app's words; the ids of the nodes whose capabilities stay are the current surface's (containers by the capabilities they held), so a change of form reconciles by SemId; pure (uir, sem, serde_json, thiserror), no engine, comps or network; with a surface shown, a Transformer answers operations of uir::transform instead (task-70 phase 2, adapt.rs): transform_verified applies them in order, each verified again, and returns them only with the verified Adapted they make; Rules reads a second grammar of changes (less, compare with a word of difficulty, bigger, undo; english and portuguese; change.rs, reshape.rs) and picks targets by the structure and the registry; Llm asks for {\"ops\": [...]} with its own prompt (ops.rs) and sends back the operation refused; compose (task-70 phase 3): Detector reads the stages of a dispatcher (live through Listener, a ReceiptSink; recorded from the session stage events) and finds the same sequence by the same actor repeated at the end, steps equal by action on the same node or on items of one collection, no parameter value kept; Composer offers it, a person accepts or declines (PERSON_ONLY requests of the app), Composite declares it as an action of the app after its projection with the narrowest policy of its steps, Chain runs it as requests of the same actor, each observed on the state the step before left, the first refused stopping it with which step and why, nothing rolled back"
depends = ["uir", "sem"]

[crates.claude-model]
path = "crates/claude-model"
role = "the Claude as the model of a proposer (task-69 phase 3b-i, decision 13 of the program): ClaudeCli implements propose::Model by running the claude -p of Claude Code as a child process, the prompt on its stdin and one json result read from its stdout (the reply, or the error with its kind, and the cost and turns the child counts), with no tools, no saved session, no MCP server, no settings file, no skill, a short system prompt of its own, in a directory of its own and without the variables a Claude Code session sets for its processes; program (PLEV_CLAUDE or claude), model (sonnet), timeout (180 s, then the child is killed by its pid), budget (--max-budget-usd 0.5) and directory are fields; every failure (could not start, killed at the timeout, a failure exit, an error result, no result) is a short ModelError; the calls are logged with time, cost and turns; the network is the child's, the crate opens no socket and holds no key; the tests run a fake claude (tests/fake-claude), never the real one; examples/propose asks the Claude through propose::Llm and propose_verified over the todo's or the ide's golden projection and prints what the rules make of the intent, each attempt with its time, cost and the verifier's errors, and the verified IR"
depends = ["propose"]

[crates.git]
path = "crates/git"
role = "gix reads + git cli mutations, desktop-only"

[crates.narrate]
path = ["crates/narrate", "crates/narrate-macro"]
role = "ui dsl (experimental)"
