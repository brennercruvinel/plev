[crates.svg]
path = "crates/svg"
role = "svg (still image) importer: usvg normalizes the document (groups, transforms, use/defs, shape-to-path), lyon tessellates the flat tree into one keyframe, encode .monster; gradients approximate to a solid, filters/masks/clips/text are skipped visibly"
depends = ["engine", "monster"]
emits-to = ["monster"]

[crates.parser]
path = "crates/parser"
role = "parse-resolve-emit transpiler poc (react tsx+sass and gpui -> plev builder source via tree-sitter; HOFF token mapping, honest droplist with file:line, golden + compile tests in crates/parser/tests); since task-71 phase 1 (adr importers-target-plev-ir) a second emitter over the same ParserNode, emit_ir -> uir::Ir, with a Report putting every source construct in one of supported, transformed, approximated, impossible at its file:line (json form plev_report 1), values to the nearest theme token within a measured tolerance (tokens: half the distance to the nearest different token), controls (button, onClick, text input) as components bound to actions the app must declare (binding required; the importer declares nothing); the ParserNode carries its Origin additively and the builder code is byte-identical; tests/pixels.rs draws both headless and explains the difference"
depends = ["engine", "builder", "theme (emitted code only)", "uir", "surface, sem, comps (tests only)"]

[crates.monster]
path = "crates/monster"
role = "binary animation codec (ir/validate/write/read) with full delta ops (modify tracks + place/replace/remove), delta discovery from sampled frames (discover/discover_fit: encoder mode b, slot diffing + linear segment fitting + keyframes on discontinuity and cadence), encoder-side optimizer (optimize: idempotent static collapse + rdp keyframe reduction + collinear fusion, tolerances in wire quantization steps) + deterministic player (play/play_eval: tick-driven, windowed eval, segment-local op replay, signals, lowers ir to SceneNode) + raise (the mirror of lower: SceneNode -> ir for every kind the ir carries, push order as depth and id, assets into a bank once per content; clip, backdrop blur and shadow reported, never dropped silently; feeds a recorder's frames to discover)"
depends = ["engine", "animation", "signal", "compositor"]

