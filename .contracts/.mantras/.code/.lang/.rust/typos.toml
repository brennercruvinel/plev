# typos contract for the plev workspace (crate-ci/typos).
#
# discovery: typos walks up from the path it checks looking for typos.toml.
# this file lives under .contracts to keep the root clean; CI and the .zed
# task pass it with `typos --config <this>`. it catches spelling slips in
# code, comments and docs without flagging the project's domain vocabulary.
#
# this repo is bilingual by design (comments in english AND portuguese), so an
# english spell-checker flags real portuguese words. the allowlist below
# covers the recurring ones; the CI job stays non-blocking (continue-on-error)
# so a new portuguese word never blocks a PR. add recurring false positives
# here as `word = "word"` (maps to itself = treated as correct).

[files]
extend-exclude = [
    "target/",
    "dist/",
    "**/*.lock",
    "**/*.monster",
    "android/app/build/",
    "ios/showcase/build/",
    "refs/",
    "codigo-descartado/",
    # kdb/ is the knowledge base: long-form bilingual prose (mostly
    # portuguese), where an english spell-checker is all false positives and
    # no signal. typos earns its keep on code and the english-facing docs;
    # kdb/arc/ is english-facing (the arc trio), so it stays checked.
    "kdb/adr/",
    "kdb/how-to/",
    "kdb/mission/",
    "kdb/refs/",
    "kdb/livrocaranguejovermelho/",
    # notes.md is a bilingual scratch doc; same story.
    "kdb/notes.md",
    # these narrate-macro tests are FULL of deliberate misspellings: they test
    # the did-you-mean / levenshtein suggestion path (buton -> button, scrolll
    # -> scroll). flagging them is exactly backwards.
    "crates/narrate-macro/src/parse/keywords/tests.rs",
    "crates/narrate-macro/src/parse/tests/errors.rs",
]

[default.extend-words]
# project and domain vocabulary that is not a typo.
plev = "plev"
hoff = "hoff"
oklch = "oklch"
srgb = "srgb"
taffy = "taffy"
wgpu = "wgpu"
winit = "winit"
gpui = "gpui"
bodymovin = "bodymovin"
# portuguese words the english dictionary mistakes for typos (bilingual repo).
caracteres = "caracteres"
classe = "classe"
componente = "componente"
componentes = "componentes"
controle = "controle"
erro = "erro"
erros = "erros"
leve = "leve"
parametros = "parametros"
progresso = "progresso"
repare = "repare"
ser = "ser"
variantes = "variantes"
fase = "fase"
tema = "tema"
essencial = "essencial"
interprete = "interprete"
exata = "exata"
# false positives in code/strings: "caf" is "Café"/"café" with the accent
# escaped (\u{00e9}) or truncated in a grapheme test; "mis" is the "mis-sized"
# prefix; "ovrlap" is a deliberate short chart label that tests label overlap.
caf = "caf"
mis = "mis"
ovrlap = "ovrlap"

[default.extend-identifiers]
# code identifiers that read as typos but are intentional: `iy` pairs with
# `ix` (inner x/y) in the scene-build bench; the levenshtein keyword tests use
# deliberately misspelled fixtures.
iy = "iy"
buton = "buton"
clik = "clik"

[default]
# the project writes docs and comments in english and portuguese; let the
# locale-agnostic dictionary run and lean on extend-words for domain terms.
locale = "en"
