# xcodegen spec for the plev uigallery iOS app.
#
# The app is a thin shell: `Sources/main.m` calls `uigallery_ios_main`, exported
# by the Rust staticlib (libuigallery.a). winit drives UIApplicationMain from
# inside that call. The lib is a plain rlib in its manifest, so the staticlib
# is asked for on the command line; build it first with
#   cargo rustc -p uigallery --lib --target <triple> --crate-type staticlib
# then point LIBRARY_SEARCH_PATHS at <cargo's target directory>/<triple>/<profile>
# (passed by the build script, tool/tasks/mobileapp.sh, which asks cargo where
# that directory is). Regenerate with `xcodegen generate`
# in this directory. The Info.plist xcodegen writes goes under build/, next to
# the rest of the build output, so it never overwrites the tracked Info.plist.
name: UIGallery
options:
  bundleIdPrefix: com.plev
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  UIGallery:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: plev uigallery
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - metal
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plev.uigallery
        # Simulator on Apple Silicon is arm64; the Rust staticlib is arm64 only.
        ARCHS: arm64
        EXCLUDED_ARCHS: x86_64
        ONLY_ACTIVE_ARCH: YES
        # The Rust staticlib already bundles all Rust deps; only system
        # frameworks remain. `mobileapp.sh ios` appends the absolute path to
        # libuigallery.a, so the link never depends on what else is named
        # libuigallery in that folder.
        OTHER_LDFLAGS:
          - $(inherited)
          - -lc++
    dependencies:
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: Foundation.framework
      - sdk: CoreGraphics.framework
      - sdk: Security.framework
