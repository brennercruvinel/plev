[package]
name = "uigallery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
# two bins (the second is the web entry, see src/bin/web.rs): `cargo run -p
# uigallery` keeps running the gallery.
default-run = "uigallery"
description = "plev design system gallery — every widget, every state, every theme"

# lib: rlib for the desktop/web bin; cdylib is the android `.so` (GameActivity
# loads it and calls `android_main`); staticlib is the iOS `.a` linked by the
# Xcode app (which calls `uigallery_ios_main`).
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uigallery"
path = "src/main.rs"

# the web entry trunk builds (apps/uigallery/web/index.html): a name of its own, see the file.
[[bin]]
name = "uigallery-web"
path = "src/bin/web.rs"

[dependencies]
engine.workspace = true
editor.workspace = true
winit.workspace = true
log.workspace = true
web-time.workspace = true
# the todo page runs every click through the semantic dispatcher.
accord.workspace = true
# the Surface page verifies the todo's IR fixture against the todo's
# projection (plevir) and materializes it over the todo's state (screen).
screen.workspace = true
plevir.workspace = true
# the Surface page's intent field proposes a surface by the rules (task-69
# phase 3a), through the todo's dispatcher.
offers.workspace = true
unions.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true
pollster.workspace = true

# The Git tab embeds the idestudio workspace over a real git worker: desktop only
# (the worker needs a thread and the git CLI).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
idestudio.workspace = true
gitdrv.workspace = true
# the agent port (PLEV_AGENT=1, debug): agents observe and act on the
# active page over a local socket, through the hooks a screen reader uses.
socket.workspace = true
# the flight recorder (PLEV_RECORD=1, debug): the shell records its
# session as the idestudio does (src/shell/window/record.rs), for plev-inspect.
record.workspace = true
# `--render --semantics` writes the page's projection in the accord serde
# form, the json an agent receives from `plev observe`.
serde.workspace = true
serde_json.workspace = true
# the Surface page asks the Claude for a surface through `claude -p`
# (task-69 phase 3b-ii): a child process run on a thread of its own.
# desktop only; where it is absent the page proposes by the rules.
claude.workspace = true

[dev-dependencies]
# the agent port's cost test weighs a leaner JSON form of a snapshot.
serde_json.workspace = true
# the svg importer reads `--render --svg` exports back: the round trip is
# the test that the file is well-formed svg with drawable content.
import.workspace = true
# the scene codec, its probe and the recording's cost run over every page
# of the gallery (tests/scene_codec.rs, scene_probe.rs, record_cost.rs):
# the scene goes through the recorder's channel as motion data.
motion.workspace = true
indexmap.workspace = true
# tool/bench/regress decodes the png a baseline keeps and writes its
# baselines into temporary directories in its tests.
image.workspace = true
tempfile.workspace = true

# the recorded demo (tests/fixtures/sessions) is read back the way plev-inspect
# reads it: the inspector answers "why" about an act on the generated
# surface. desktop only, like the recording.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dev-dependencies]
replay.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_log.workspace = true
console_error_panic_hook.workspace = true

# Android pulls the GameActivity winit backend (via the engine feature) and a
# logcat-backed logger; the cdylib above is what gets packaged into the APK.
[target.'cfg(target_os = "android")'.dependencies]
engine = { workspace = true, features = ["android-game-activity"] }
android_logger.workspace = true

[lints]
workspace = true
