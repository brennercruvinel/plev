# the laboratory of the plev experiment (task-62 phase c): the idestudio's
# workbench without a window, served to agents through the port, recorded,
# measured and checked against the real git. unix only (the port is a unix
# socket); elsewhere it says so and exits.
[package]
name = "agenteval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "`agenteval`: the laboratory of the plev experiment (task-62, phase c)"
# the integration tests are one executable, tests/suite.rs, a module per file
# (task-106): cargo links every file under tests/ as an executable of its
# own, each with the whole crate inside. a target listed apart at the end of
# this file is one that needs a process to itself.
autotests = false

[dependencies]
idestudio.workspace = true
engine.workspace = true
gitdrv.workspace = true
accord.workspace = true
socket.workspace = true
record.workspace = true
serde_json.workspace = true
tempfile.workspace = true
env_logger.workspace = true
log.workspace = true
unions.workspace = true

[dev-dependencies]
replay.workspace = true

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
