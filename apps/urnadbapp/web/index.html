<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>urnadbapp — urna database explorer</title>
    <!-- Trunk builds the urnadbapp-web bin to wasm and injects the JS glue. -->
    <link data-trunk rel="rust" href="../Cargo.toml" data-bin="urnadbapp-web" />
    <!-- The Noto faces stay out of the wasm and are fetched from fonts/
         when a text first shows their script (engine drawing/text/on_demand.rs,
         issue #137); the licenses travel with them. -->
    <link data-trunk rel="copy-dir" href="../../../rust/engine/assets/fonts" />
    <style>
      /* Match the app's dark surface so there's no white flash
         while the wasm module loads and the GPU initializes. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #303030;
      }

      /* The canvas (appended to <body> by engine::window::setup_wasm_canvas)
         is sized by CSS: winit's ResizeObserver turns CSS size changes into
         WindowEvent::Resized, so the app tracks the browser window. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
    </style>
  </head>
  <body></body>
</html>
