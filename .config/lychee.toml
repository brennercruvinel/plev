# lychee contract for the plev workspace: every link in the docs resolves.
#
# run from the repository root:
#   lychee --config .config/lychee.toml --offline .
# offline: the gate checks links into this repository (files, anchors, the
# tree's own paths), the ones a move can break. links out to the web are
# checked on demand without --offline; they come and go on their own.

# markdown, toml and the html pages; a link inside a code block is an
# example, not a reference.
include_verbatim = false
extensions = ["md", "toml", "html"]

# the generated, the vendored and the scratch never hold doc links.
exclude_path = [
    "target",
    "boiler",
    "data",
    "tool/bench/regress/baselines",
    "apps/uigallery/web/dist",
    "apps/urnadbapp/web/dist",
    # the two static sites: zola's templates hold template expressions
    # where a link would be (`{{ url }}`), and quartzweb is a submodule,
    # another repository's tree.
    "apps/zolaviews/templates",
    "apps/zolaviews/themes",
    "apps/quartzweb",
]

# local placeholders written in the docs as examples, not as links.
exclude = [
    "^file:///.*/(urna|refs)/",
    "^mailto:",
    # an elided path quoted from a log (`file:///.../target/debug/`)
    "^file:///\\.\\.\\./",
]

# a #fragment must name a heading of the file it points into.
include_fragments = "anchor-only"
