# rec: the session flight recorder (task-63,
# docs/ADR/session-recording-replay-not-reexecution.md). it records what an
# app did as data (observations, snapshots, receipts, input, frames) in a
# bounded ring, and reads it back. it never creates a request.
[package]
name = "rec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Session flight recorder of plev: semantic events, receipts and sampled frames as data in a bounded ring; replay, never re-execution"

[dependencies]
engine.workspace = true
monster.workspace = true
# with its serde form (a default feature of sem): recorded events carry
# snapshots, requests and stages.
sem.workspace = true
# the session file's semantic section is one json line per event, so
# serde is not optional here. snapshots and requests are shared between
# events behind an Arc, hence the rc feature.
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
# a sha256 per section of the session file, the monster container's
# discipline; default-features off like monster's.
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# the showcase todo page is the real scene the recording cost is measured
# on (tests/session/measure.rs); the showcase is only read.
showcase = { path = "../showcase" }
comps.workspace = true
indexmap.workspace = true
# a temporary directory per file test.
tempfile.workspace = true

[lints]
workspace = true
