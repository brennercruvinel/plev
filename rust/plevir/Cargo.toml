# plevir: the plev IR and its verifier (task-68,
# docs/adr/Synthesis/0049-plev-ir-typed-and-verified/0049-plev-ir-typed-and-verified.md). pure on purpose, like accord: it
# depends on accord and serde only, never on engine (its widgets included) or socket. the
# component and token vocabulary is declared here as data; binding it to
# the engine's widgets and the theme is the materializer's job (task-69).
[package]
name = "plevir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "plev IR: an interface surface described by meaning (identity, a closed component vocabulary, props by token, state and actions bound to the capabilities an app declares) and the verifier that is the only way to a VerifiedIr"

[dependencies]
# the contract the IR references: SemId, StateRef, ValueKind, Role,
# ActionName, ParamSpec, Policy, Actor, and the snapshot the capability
# registry is built from. its default feature is its serde form.
accord.workspace = true
serde.workspace = true
serde_json.workspace = true
unions.workspace = true

[dev-dependencies]
# random IRs: the verifier never panics, serde round trips, the schema
# accepts what serde writes.
proptest.workspace = true

[lints]
workspace = true
