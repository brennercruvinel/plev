# screen: the host of surfaces materialized from verified plev IR
# (task-69, docs/adr/Synthesis/0051-materialized-surfaces-from-verified-ir/0051-materialized-surfaces-from-verified-ir.md). a
# `plevir::VerifiedIr` becomes a live surface: laid out by the engine's
# LayoutEngine, every token read from the Theme, drawn by the engine::widgets
# widgets, projected from the IR itself, and every event a accord::Request
# the app's own dispatcher runs. it never executes anything. engine::widgets stays a
# widget library that knows nothing of the IR; this crate is the bridge.
[package]
name = "screen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "plev surfaces materialized from verified IR: layout by the engine, tokens by the Theme, widgets by comps, semantics from the IR, events as requests through the app's dispatcher"
# the integration tests are one executable, tests/suite.rs, a module per file
# (task-106): cargo links every file under tests/ as an executable of its
# own, each with the whole crate inside. a target listed apart at the end of
# this file is one that needs a process to itself.
autotests = false

[dependencies]
# the IR and its verifier: only a VerifiedIr materializes.
plevir.workspace = true
# the contract a surface projects into and asks through (Request,
# Snapshot, SnapshotBuilder).
accord.workspace = true
# LayoutEngine, Theme, Compositor.
engine.workspace = true
# the widgets every component is drawn by.
log.workspace = true
thiserror.workspace = true
unions.workspace = true

[dev-dependencies]
# the fixtures of task-68 are JSON, and so are the snapshots they are
# written against.
serde_json.workspace = true
# the test app keeps the fixture's nodes as the snapshot does.
indexmap.workspace = true

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
