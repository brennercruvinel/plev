[package]
name = "gitdrv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Git backend for plev apps: gix for reads, git CLI for the rest. No UI dependencies."
# the integration tests are one executable, tests/suite.rs, a module per file
# (task-106): cargo links every file under tests/ as an executable of its
# own, each with the whole crate inside. a target listed apart at the end of
# this file is one that needs a process to itself.
autotests = false

[dependencies]
# Read-side (open/log/branches/HEAD). Mutations and worktree status/diff go
# through the git CLI (see ADR notes in repo.rs). Minimal feature set: a
# hash algorithm is mandatory, "revision" covers rev_walk specs and
# "parallel" swaps internal Rc for Arc so Repository can move into the
# GitClient worker thread.
gix.workspace = true
unions.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
