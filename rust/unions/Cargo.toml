# unions: the union of the features the workspace activates, so a build of
# one member (`cargo run -p arcade`) reuses the dependencies a build of the
# whole workspace compiled, instead of compiling a second copy. every member
# depends on it; it holds no code. the section below is written by
# `cargo hakari generate` (see .config/hakari.toml), never by hand.
[package]
name = "unions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "The union of the workspace's dependency features, so one member's build reuses the workspace's (managed by cargo hakari)"

### BEGIN HAKARI SECTION
[dependencies]
crossbeam-utils = { version = "0.8" }
hashbrown = { version = "0.17" }
indexmap = { version = "2", features = ["serde"] }
jiff = { version = "0.2" }
log = { version = "0.4", default-features = false, features = ["std"] }
num-traits = { version = "0.2", features = ["libm"] }
once_cell = { version = "1" }
regex = { version = "1", default-features = false, features = ["perf", "std", "unicode"] }
regex-automata = { version = "0.4", default-features = false, features = ["dfa-onepass", "dfa-search", "hybrid", "meta", "nfa-backtrack", "perf-inline", "perf-literal", "std", "unicode"] }
regex-syntax = { version = "0.8" }
serde = { version = "1", features = ["alloc", "derive", "rc"] }
serde_core = { version = "1", default-features = false, features = ["alloc", "rc", "result", "std"] }
serde_json = { version = "1", features = ["preserve_order"] }
smallvec = { version = "1", default-features = false, features = ["write"] }
winit = { version = "0.30", features = ["android-game-activity"] }
zerocopy = { version = "0.8", default-features = false, features = ["derive", "simd"] }

