# accord: the semantic contract (task-57, docs/adr/Semantics/0032-semantic-contract-as-pure-projection/0032-semantic-contract-as-pure-projection.md).
# pure on purpose: no gpu, no window, no text stack, so an agent, the
# recorder, a headless tool or a cli can link it without the render stack.
[package]
name = "accord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Semantic contract of plev: persistent logical identity, meaning, state, actions and constraints of every control, as pure data"
# the integration tests are one executable, tests/suite.rs, a module per file
# (task-106): cargo links every file under tests/ as an executable of its
# own, each with the whole crate inside. a target listed apart at the end of
# this file is one that needs a process to itself.
autotests = false

[features]
default = ["serde"]
# the serde form is a contract with the agent protocol and the recorder;
# ids and refs travel as their canonical text.
serde = ["dep:serde", "indexmap/serde"]

[dependencies]
indexmap.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true
unions.workspace = true

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/suite.rs"
