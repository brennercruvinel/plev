# Taplo config: https://taplo.tamasfe.dev
# toml in this repo (config.toml, theme.toml, i18n/*.toml) is tab-indented, so we
# keep taplo from rewriting that to spaces and we do not reorder keys (config.toml
# has a deliberate, commented order).
include = ["*.toml", "i18n/*.toml"]
exclude = ["public/**"]

[formatting]
indent_string = "\t"
align_entries = false
reorder_keys = false
column_width = 100
