# parser: parse-resolve-emit transpiler poc (react/tsx + gpui -> plev builder).
# See src/lib.rs for the three-stage architecture and the droplist contract.
[package]
name = "parser"
version.workspace = true
edition.workspace = true
publish = false
description = "Universal UI transpiler PoC: react/tsx + gpui sources to plev builder code, with an honest droplist"

[dependencies]
tree-sitter.workspace = true
tree-sitter-typescript.workspace = true
tree-sitter-rust.workspace = true
thiserror.workspace = true

[dev-dependencies]
# janela do preview ao vivo (examples/preview.rs)
pollster.workspace = true
env_logger.workspace = true
# The emitted golden outputs are compiled and executed by
# tests/emitted_compiles.rs, so the engine is a dev-dependency only.
plev.workspace = true

[lints]
workspace = true
