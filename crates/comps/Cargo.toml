# comps: the plev design system. every widget, recipe, icon, chart and
# overlay the apps share, in one crate over the engine. widgets read every
# visual value from `engine::theme::Theme` (tokens); nothing here restates
# a number the theme already owns. see docs/catalog.md for the inventory
# and the migration record.
[package]
name = "comps"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
description = "plev design system: retained widgets, glass recipes, icons, charts, overlays and the editor, all resolved from Theme tokens"

[lints]
workspace = true

[dependencies]
engine.workspace = true
rope.workspace = true
winit.workspace = true
web-time.workspace = true
unicode-segmentation.workspace = true
rustc-hash.workspace = true

[dev-dependencies]
wgpu.workspace = true
pollster.workspace = true
env_logger.workspace = true
