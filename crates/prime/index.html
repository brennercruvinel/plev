<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>prime number creatures</title>
    <!-- Trunk builds this crate's bin to wasm and injects the JS glue. Serve
         from this directory: `trunk serve` (WebGPU only, Chrome/Edge 113+). -->
    <link data-trunk rel="rust" href="Cargo.toml" data-bin="prime" />
    <style>
      /* Match the near-black demo background so there is no flash while the
         wasm module loads and the GPU initializes. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050508;
      }

      /* The canvas (appended to <body> by plev::window::setup_wasm_canvas) is
         CSS-sized; winit's ResizeObserver turns CSS size changes into
         WindowEvent::Resized, so the app tracks the browser window. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
      }
    </style>
  </head>
  <body></body>
</html>
