[package]
name = "ide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Simple IDE test"

[[bin]]
name = "ide"
path = "src/main.rs"

[dependencies]
engine.workspace = true
comps.workspace = true
git.workspace = true
# the workbench: the workspace as a capability every actor reaches
# through one dispatcher.
sem.workspace = true
wgpu.workspace = true
winit.workspace = true
log.workspace = true
env_logger.workspace = true
pollster.workspace = true
# Same major as plev's optional hot-reload dep (shared build cache).
notify.workspace = true

[dev-dependencies]
# real repositories in temp dirs, like crates/git/tests/real_repo.rs.
tempfile.workspace = true

[lints]
workspace = true
