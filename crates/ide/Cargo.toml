[package]
name = "ide"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
# two bins (the ide and ide-lab): `cargo run -p ide` runs the ide.
default-run = "ide"
description = "Simple IDE test"

[[bin]]
name = "ide"
path = "src/main.rs"

# the laboratory of the plev experiment (task-62 phase c): the workbench
# without a window, served to agents through the port, recorded, measured
# and checked against the real git. unix only (the port is a unix
# socket); elsewhere it says so and exits.
[[bin]]
name = "ide-lab"
path = "src/bin/lab/main.rs"

[dependencies]
engine.workspace = true
comps.workspace = true
git.workspace = true
# the workbench: the workspace as a capability every actor reaches
# through one dispatcher.
sem.workspace = true
wgpu.workspace = true
winit.workspace = true
log.workspace = true
env_logger.workspace = true
pollster.workspace = true
# Same major as plev's optional hot-reload dep (shared build cache).
notify.workspace = true
# the agent port: the lib serves the workbench through it (src/agent.rs,
# unix only), the ide's window opens it with PLEV_AGENT=1 in a debug build,
# and the laboratory (src/bin/lab) serves it too.
wire.workspace = true
# the flight recorder: the lib records the ide's session with it
# (src/record.rs, PLEV_RECORD=1 in a debug build), and the laboratory
# (src/bin/lab) around its workbench. the laboratory's report as json and
# its real repository in a temp dir: the lib uses neither; cargo has no
# per-binary dependencies.
rec.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[dev-dependencies]
# the recording test reads the session back the way plev-inspect does,
# and asks it why each act of the agent went as it did.
inspect = { path = "../inspect" }

[lints]
workspace = true
