[package]
name = "llm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "local llm inference in process: one streaming interface, candle and burn behind features"

# llm is NOT a member of the root workspace (see the exclude + comment in the
# root Cargo.toml): candle and burn pull a dependency tree the engine does not
# need (burn brings wgpu 29, the engine is on 28), so it keeps its own
# workspace and its own Cargo.lock. build it with --manifest-path
# crates/llm/Cargo.toml.
[workspace]

[features]
default = ["text"]
# the tokenizer and the chat template: native only (onig is C).
text = ["dep:tokenizers"]
# candle on the cpu; add `metal` for the gpu.
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:serde_json"]
# burn on the cpu (ndarray); add `metal` for the gpu (wgpu with the msl compiler).
burn = ["dep:burn", "dep:burn-store", "burn/ndarray", "dep:serde", "dep:serde_json"]
# the apple gpu for whichever backend is on.
metal = [
    "candle-core?/metal",
    "candle-nn?/metal",
    "candle-transformers?/metal",
    "burn?/metal",
    "burn?/fusion",
    "burn?/autotune",
]

[dependencies]
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
tokenizers = { version = "0.22", default-features = false, features = ["onig"], optional = true }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
burn = { version = "0.21", default-features = false, features = ["std"], optional = true }
burn-store = { version = "0.21", default-features = false, features = ["std", "safetensors", "memmap"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["sync", "rt", "macros"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
uninlined_format_args = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
