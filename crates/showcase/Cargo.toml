[package]
name = "showcase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "plev design system gallery — every widget, every state, every theme"

# lib: rlib for the desktop/web bin; cdylib is the android `.so` (GameActivity
# loads it and calls `android_main`); staticlib is the iOS `.a` linked by the
# Xcode app (which calls `showcase_ios_main`).
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "showcase"
path = "src/main.rs"

# the structural regression harness (task-67). `test = true`: cargo only
# builds an example under `cargo test`; this one runs its tests there too,
# so the comparator's tests are part of the gate.
[[example]]
name = "regress"
path = "examples/regress/main.rs"
test = true

[dependencies]
engine.workspace = true
comps.workspace = true
rope.workspace = true
wgpu.workspace = true
winit.workspace = true
log.workspace = true
web-time.workspace = true
# the todo page runs every click through the semantic dispatcher.
sem.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true
pollster.workspace = true

# The Git tab embeds the ide workspace over a real git worker: desktop only
# (the worker needs a thread and the git CLI).
[target.'cfg(not(any(target_arch = "wasm32", target_os = "android", target_os = "ios")))'.dependencies]
ide.workspace = true
git.workspace = true
# the agent port (PLEV_AGENT=1, debug): agents observe and act on the
# active page over a local socket, through the hooks a screen reader uses.
wire.workspace = true
# `--render --semantics` writes the page's projection in the sem serde
# form, the json an agent receives from `plev observe`.
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# the agent port's cost test weighs a leaner JSON form of a snapshot.
serde_json.workspace = true
# the svg importer reads `--render --svg` exports back: the round trip is
# the test that the file is well-formed svg with drawable content.
svg.workspace = true
# examples/regress decodes the png a baseline keeps and writes its
# baselines into temporary directories in its tests.
image.workspace = true
tempfile.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_log.workspace = true
console_error_panic_hook.workspace = true

# Android pulls the GameActivity winit backend (via the engine feature) and a
# logcat-backed logger; the cdylib above is what gets packaged into the APK.
[target.'cfg(target_os = "android")'.dependencies]
engine = { workspace = true, features = ["android-game-activity"] }
android_logger.workspace = true

[lints]
workspace = true
