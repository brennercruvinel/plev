[package]
name = "showcase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "plev design system gallery — every widget, every state, every theme"

# lib: rlib for the desktop/web bin; cdylib is the android `.so` (GameActivity
# loads it and calls `android_main`); staticlib is the iOS `.a` linked by the
# Xcode app (which calls `showcase_ios_main`).
[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "showcase"
path = "src/main.rs"

[dependencies]
engine.workspace = true
wgpu.workspace = true
winit.workspace = true
log.workspace = true
web-time.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger.workspace = true
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
console_log.workspace = true
console_error_panic_hook.workspace = true

# Android pulls the GameActivity winit backend (via the engine feature) and a
# logcat-backed logger; the cdylib above is what gets packaged into the APK.
[target.'cfg(target_os = "android")'.dependencies]
engine = { workspace = true, features = ["android-game-activity"] }
android_logger.workspace = true

[lints]
workspace = true
