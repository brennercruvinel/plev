[package]
name = "basic-ide"
version = "0.1.0"
edition = "2024"
description = "Simple IDE test"

[[bin]]
name = "basic-ide"
path = "src/main.rs"

[dependencies]
plev = { path = "../..", package = "plev" }
git_backend = { path = "../git_backend" }
wgpu = "28"
winit = { version = "0.30", features = ["rwh_06"] }
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
# Same major as plev's optional hot-reload dep (shared build cache).
notify = "7"
