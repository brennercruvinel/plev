# Trunk config for the web build of the showcase. run from the repo root:
# `script/web` (wraps `trunk --config web serve`).
#
# index.html points at crates/showcase/Cargo.toml (bin "showcase"); trunk
# runs cargo for wasm32-unknown-unknown, applies wasm-bindgen (version
# pinned by Cargo.lock), and emits everything into web/dist/.

[build]
target = "index.html"
dist = "dist"
# Engine + cosmic-text in debug wasm is huge and slow; always ship opt.
release = true

[serve]
addresses = ["127.0.0.1"]
port = 8080
open = false
