# Trunk config for the web build of urnaui. run from the repo root:
# `script/web-urnaui` (wraps `trunk --config web/urnaui serve`).
#
# index.html points at crates/urnaui/Cargo.toml (bin "urnaui"); trunk
# runs cargo for wasm32-unknown-unknown, applies wasm-bindgen (version
# pinned by crates/urnaui/Cargo.lock), and emits everything into
# web/urnaui/dist/. urnaui is its own workspace (excluded from the root
# one); the native urna backend is cfg'd out on wasm, but cargo still
# reads its manifest, so the sibling urna checkout at ../urna must exist.

[build]
target = "index.html"
dist = "dist"
# Engine + cosmic-text in debug wasm is huge and slow; always ship opt.
release = true

[serve]
addresses = ["127.0.0.1"]
port = 8081
open = false
