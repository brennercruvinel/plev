name: gatecheck

# the gate from tool/tasks/fullcheck.sh, one job per part so a red check
# names the failing gate. clippy is the canonical check command; fmt, test,
# the structural regression and the wasm cross-platform guard run alongside
# it, and the docs' links with them.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy -D warnings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test --workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # debuginfo off: linking every wgpu demo with full debug info
      # exceeds the runner's disk and kills the linker with SIGBUS.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  regress:
    # structural regression (task-67, docs/adr/workflows/0045-regression-by-meaning-before-pixels.md):
    # every baseline under tool/bench/regress/baselines is staged and
    # compared by meaning, then by layer hash and binding. when nothing
    # moved no frame is drawn, so the job needs no GPU. a layer that moved
    # on a baseline keeping an image draws the frame through
    # engine::drawing::headless; without an adapter the report says the
    # pixels were not compared and the verdict stays the hash's, never a GPU
    # failure. a change that moves a page is accepted with
    # `cargo run -p regress -- bless` in the same change.
    name: structural regression (macos)
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p regress -- check --json regress-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regress-report
          path: regress-report.json
          if-no-files-found: ignore

  wasm:
    name: wasm check (uigallery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown -p uigallery

  urnadbapp:
    # urnadbapp is excluded from the root workspace: its native backend
    # path-depends on the sibling urna workspace. this job recreates that
    # layout (urna checked out at ../urna relative to the plev root) and runs
    # its gate: native tests, clippy, and the wasm web target.
    name: urnadbapp (sibling urna checkout)
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: hoffresearch/urna
          path: urna-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: ln -sfn "$GITHUB_WORKSPACE/urna-src" "$(dirname "$GITHUB_WORKSPACE")/urna"
      - run: cargo test --manifest-path apps/urnadbapp/Cargo.toml
      - run: cargo clippy --manifest-path apps/urnadbapp/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --manifest-path apps/urnadbapp/Cargo.toml --target wasm32-unknown-unknown

  unions:
    # rust/unions is the union of the workspace's dependency features
    # (.config/hakari.toml): generate --diff fails when a dependency change
    # left it behind, manage-deps --dry-run when a member does not depend on
    # it. the fix for either is the same command without the flag.
    name: unions (cargo hakari)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari
      - run: cargo hakari generate --diff
      - run: cargo hakari manage-deps --dry-run

  links:
    name: docs links (lychee, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docs headers, links, anchors and catalog
        run: python3 tool/tasks/docbase.py check
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config .devops/check/lychee.toml --offline .
          fail: true

  typos:
    name: typos (advisory)
    runs-on: ubuntu-latest
    # non-blocking on purpose: this repo is bilingual (english + portuguese
    # comments), so an english spell-checker will flag real portuguese words.
    # the job surfaces genuine english typos as annotations without ever
    # failing a PR for portuguese content. recurring false positives go in the
    # allowlist at .devops/check/typos.toml.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@master
        with:
          config: .devops/check/typos.toml
