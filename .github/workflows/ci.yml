name: ci

# the four-part gate from AGENTS.md, one job per part so a red check names
# the failing gate. clippy is the canonical check command; fmt, test and the
# wasm cross-platform guard run alongside it.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy -D warnings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test --workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      # debuginfo off: linking every wgpu example with full debug info
      # exceeds the runner's disk and kills the linker with SIGBUS.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  regress:
    # structural regression (task-67, docs/ADR/regression-by-meaning-before-pixels.md):
    # every baseline under crates/showcase/fixtures/regress is staged and
    # compared by meaning, then by layer hash and binding. when nothing
    # moved no frame is drawn, so the job needs no GPU. a layer that moved
    # on a baseline keeping an image draws the frame through
    # engine::headless; without an adapter the report says the pixels were
    # not compared and the verdict stays the hash's, never a GPU failure.
    # a change that moves a page is accepted with
    # `cargo run -p showcase --example regress -- bless` in the same change.
    name: structural regression (macos)
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p showcase --example regress -- check --json regress-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regress-report
          path: regress-report.json
          if-no-files-found: ignore

  wasm:
    name: wasm check (showcase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown -p showcase

  urnaui:
    # urnaui is excluded from the root workspace: its native backend
    # path-depends on the sibling urna workspace. this job recreates that
    # layout (urna checked out at ../urna relative to the plev root) and runs
    # the urnaui gate: native tests, clippy, and the wasm web target.
    name: urnaui (sibling urna checkout)
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: hoffresearch/urna
          path: urna-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - run: ln -sfn "$GITHUB_WORKSPACE/urna-src" "$(dirname "$GITHUB_WORKSPACE")/urna"
      - run: cargo test --manifest-path crates/urnaui/Cargo.toml
      - run: cargo clippy --manifest-path crates/urnaui/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --manifest-path crates/urnaui/Cargo.toml --target wasm32-unknown-unknown

  typos:
    name: typos (advisory)
    runs-on: ubuntu-latest
    # non-blocking on purpose: this repo is bilingual (english + portuguese
    # comments), so an english spell-checker will flag real portuguese words.
    # the job surfaces genuine english typos as annotations without ever
    # failing a PR for portuguese content. recurring false positives go in the
    # allowlist at .contracts/.mantras/.code/.lang/.rust/typos.toml.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@master
        with:
          config: .contracts/.mantras/.code/.lang/.rust/typos.toml
