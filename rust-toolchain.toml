# pins the toolchain for everyone (rustup reads this). the workspace needs
# 1.87+ (rust-version in Cargo.toml, the floor of wgpu 29), and stable is
# always above it. wasm32 ships with the toolchain because the gate checks
# the web build on every change.
[toolchain]
channel = "stable"
components = ["rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown"]
