[workspace]
resolver = "2"
# Every crate in the project is a member (each shows up as an IDE target).
# nestui is deliberately NOT a member: its native backend path-depends on the
# sibling nest workspace (../nest), so including it would break this workspace
# for anyone without a nest checkout (public repo, CI). it lives excluded with
# its own manifest/workspace — see crates/nestui/Cargo.toml and script/gate.
members = [
    "crates/engine",
    "crates/macros",
    "crates/git",
    "crates/ide",
    "crates/lot",
    "crates/monster",
    "crates/svg",
    "crates/narrate",
    "crates/narrate-macro",
    "crates/parser",
    "crates/prime",
    "crates/rope",
    "crates/showcase",
]
exclude = ["crates/nestui"]

# Metadata inherited by every crate (`version.workspace = true`;
# `description` stays per crate). Private: `publish = false` on each one.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Brenner Cruvinel <brennertalks@gmail.com>"]
repository = "https://github.com/brennercruvinel/plev"

# Unified lints (inherited via `[lints] workspace = true`). Keeps the bar
# where the code already is: clippy clean under -D warnings.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
uninlined_format_args = "warn"

# Single version source for every shared dependency. Crates reference it
# with `<dep>.workspace = true`; extra per-crate features via
# `{ workspace = true, features = [...] }`.
[workspace.dependencies]
# -- internal (path)
engine = { path = "crates/engine" }
git = { path = "crates/git" }
lot = { path = "crates/lot" }
macros = { path = "crates/macros" }
monster = { path = "crates/monster" }
narrate = { path = "crates/narrate" }
narrate-macro = { path = "crates/narrate-macro" }
rope = { path = "crates/rope" }
svg = { path = "crates/svg" }
# -- gpu / window
wgpu = "28"
winit = { version = "0.30", features = ["rwh_06"] }
bytemuck = { version = "1", features = ["derive"] }
# -- text / layout / vector
cosmic-text = "0.18"
taffy = "0.9"
ropey = "1.6"
unicode-segmentation = "1"
lyon_tessellation = "1"
lyon_path = "1"
etagere = "0.2"
# svg importer: usvg normalizes a whole svg document (groups, transforms,
# gradients, use/defs, shape-to-path) into a flat tree we tessellate.
# default-features off drops fontdb/text-to-path (wasm-safe, deterministic);
# text is skipped like lot skips it. 0.45 is the last release on msrv 1.85.
usvg = { version = "0.45", default-features = false }
# -- data / util
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
indexmap = "2"
lru = "0.16"
rustc-hash = "2.1"
slotmap = "1.1"
web-time = "1.1"
sha2 = { version = "0.10", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gix = { version = "0.84", default-features = false, features = ["sha1", "revision", "parallel"] }
# -- proc-macro
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
# -- tree-sitter (parser)
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
# -- native runtime
pollster = "0.4"
env_logger = "0.11"
arboard = { version = "3", default-features = false }
notify = "7"
notify-debouncer-full = "0.7"
android_logger = "0.14"
# -- wasm
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Performance", "console"] }
console_log = "1"
console_error_panic_hook = "0.1"
# -- accessibility
accesskit = "0.24"
accesskit_winit = "0.32"
# -- tests
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
trybuild = "1"
tempfile = "3"

# Release: thin lto + one codegen unit (smaller, faster binaries; a
# slightly slower release build, acceptable).
[profile.release]
lto = "thin"
codegen-units = 1

# Dev: dependencies compiled with optimization (incremental builds of our
# own code stay fast, but heavy deps like wgpu do not drag the debug
# runtime).
[profile.dev.package."*"]
opt-level = 2
