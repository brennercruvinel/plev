[workspace]
# Todos os crates do projeto são members (aparecem como targets na IDE).
members = [
    ".",
    "macros",
    "crates/git",
    "crates/ide",
    "crates/lot",
    "crates/monster",
    "crates/narrate",
    "crates/narrate-macro",
    "crates/parser",
    "crates/prime_creatures",
    "crates/rope",
    "crates/showcase",
]

# Metadados herdados por todos os crates (`version.workspace = true`,
# `description` fica por crate). Privados: `publish = false` em cada um.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Brenner Cruvinel <brennertalks@gmail.com>"]
repository = "https://github.com/brennercruvinel/plevdev"

# Lints unificados (herdados via `[lints] workspace = true`). Mantem a
# barra onde o codigo ja esta: clippy limpo sob -D warnings.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
uninlined_format_args = "warn"

# Fonte única de versão para toda dependência compartilhada. Os crates
# referenciam com `<dep>.workspace = true`; features extras por crate via
# `{ workspace = true, features = [...] }`.
[workspace.dependencies]
# -- internos (path)
plev = { path = "." }
git = { path = "crates/git" }
lot = { path = "crates/lot" }
macros = { path = "macros" }
monster = { path = "crates/monster" }
narrate = { path = "crates/narrate" }
narrate-macro = { path = "crates/narrate-macro" }
rope = { path = "crates/rope" }
# -- gpu / janela
wgpu = "28"
winit = { version = "0.30", features = ["rwh_06"] }
bytemuck = { version = "1", features = ["derive"] }
# -- texto / layout / vetor
cosmic-text = "0.18"
taffy = "0.9"
ropey = "1.6"
unicode-segmentation = "1"
lyon_tessellation = "1"
lyon_path = "1"
etagere = "0.2"
# -- dados / util
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
indexmap = "2"
lru = "0.16"
rustc-hash = "2.1"
slotmap = "1.1"
web-time = "1.1"
sha2 = { version = "0.10", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gix = { version = "0.84", default-features = false, features = ["sha1", "revision", "parallel"] }
# -- proc-macro
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
# -- tree-sitter (parser)
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
# -- runtime nativo
pollster = "0.4"
env_logger = "0.11"
arboard = { version = "3", default-features = false }
notify = "7"
notify-debouncer-full = "0.4"
android_logger = "0.14"
# -- wasm
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Performance", "console"] }
console_log = "1"
console_error_panic_hook = "0.1"
# -- acessibilidade
accesskit = "0.24"
accesskit_winit = "0.32"
# -- testes
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
trybuild = "1"
tempfile = "3"

# Release: lto fina + uma unidade de codegen (binarios menores e mais
# rapidos; build de release um pouco mais lento, aceitavel).
[profile.release]
lto = "thin"
codegen-units = 1

# Dev: dependencias compiladas com otimizacao (build incremental do
# proprio codigo segue rapido, mas deps pesadas como wgpu nao arrastam
# o runtime de debug).
[profile.dev.package."*"]
opt-level = 2

[package]
name = "plev"
version.workspace = true
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints]
workspace = true

[features]
default = ["accessibility"]
accessibility = ["dep:accesskit", "dep:accesskit_winit"]
# Exports the engine's own `#[wasm_bindgen(start)]` entry point on wasm32.
# Off by default so downstream apps (showcase, ide, ...) can define
# their own browser entry without colliding with the engine's.
web-entry = []
android-game-activity = ["winit/android-game-activity"]
# Exports the engine's own `android_main` entry on android. Off by default so
# downstream apps can ship their own GameActivity entry without symbol clash.
android-entry = []
hot-reload = ["dep:notify", "dep:notify-debouncer-full"]

[dependencies]
wgpu.workspace = true
winit.workspace = true
cosmic-text.workspace = true
etagere.workspace = true
bytemuck.workspace = true
lru.workspace = true
rustc-hash.workspace = true
log.workspace = true
macros.workspace = true
taffy.workspace = true
slotmap.workspace = true
web-time.workspace = true
indexmap.workspace = true
lyon_tessellation.workspace = true
lyon_path.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
rope.workspace = true
unicode-segmentation.workspace = true
accesskit = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }

[dev-dependencies]
narrate.workspace = true
criterion.workspace = true
lot.workspace = true
monster.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true
env_logger.workspace = true

# arboard is a desktop clipboard backend (no android/ios platform impl); mobile
# falls back to the in-memory clipboard, so it is desktop-only here.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "android"), not(target_os = "ios")))'.dependencies]
arboard.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android_logger.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys.workspace = true
console_log.workspace = true
console_error_panic_hook.workspace = true

[package.metadata.android]
package = "com.plev.engine"
label = "plev"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
debuggable = true
has_code = false
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[[bench]]
name = "scene_build"
harness = false
