[workspace]
resolver = "2"
# Todos os crates do projeto sao members (aparecem como targets na IDE).
members = [
    "crates/engine",
    "crates/macros",
    "crates/git",
    "crates/ide",
    "crates/lot",
    "crates/monster",
    "crates/svg",
    "crates/narrate",
    "crates/narrate-macro",
    "crates/parser",
    "crates/prime",
    "crates/rope",
    "crates/showcase",
]

# Metadados herdados por todos os crates (`version.workspace = true`,
# `description` fica por crate). Privados: `publish = false` em cada um.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Brenner Cruvinel <brennertalks@gmail.com>"]
repository = "https://github.com/brennercruvinel/plevdev"

# Lints unificados (herdados via `[lints] workspace = true`). Mantem a
# barra onde o codigo ja esta: clippy limpo sob -D warnings.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
uninlined_format_args = "warn"

# Fonte única de versão para toda dependência compartilhada. Os crates
# referenciam com `<dep>.workspace = true`; features extras por crate via
# `{ workspace = true, features = [...] }`.
[workspace.dependencies]
# -- internos (path)
engine = { path = "crates/engine" }
git = { path = "crates/git" }
lot = { path = "crates/lot" }
macros = { path = "crates/macros" }
monster = { path = "crates/monster" }
narrate = { path = "crates/narrate" }
narrate-macro = { path = "crates/narrate-macro" }
rope = { path = "crates/rope" }
svg = { path = "crates/svg" }
# -- gpu / janela
wgpu = "28"
winit = { version = "0.30", features = ["rwh_06"] }
bytemuck = { version = "1", features = ["derive"] }
# -- texto / layout / vetor
cosmic-text = "0.18"
taffy = "0.9"
ropey = "1.6"
unicode-segmentation = "1"
lyon_tessellation = "1"
lyon_path = "1"
etagere = "0.2"
# svg importer: usvg normalizes a whole svg document (groups, transforms,
# gradients, use/defs, shape-to-path) into a flat tree we tessellate.
# default-features off drops fontdb/text-to-path (wasm-safe, deterministic);
# text is skipped like lot skips it. 0.45 is the last release on msrv 1.85.
usvg = { version = "0.45", default-features = false }
# -- dados / util
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
indexmap = "2"
lru = "0.16"
rustc-hash = "2.1"
slotmap = "1.1"
web-time = "1.1"
sha2 = { version = "0.10", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gix = { version = "0.84", default-features = false, features = ["sha1", "revision", "parallel"] }
# -- proc-macro
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
# -- tree-sitter (parser)
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
# -- runtime nativo
pollster = "0.4"
env_logger = "0.11"
arboard = { version = "3", default-features = false }
notify = "7"
notify-debouncer-full = "0.4"
android_logger = "0.14"
# -- wasm
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Performance", "console"] }
console_log = "1"
console_error_panic_hook = "0.1"
# -- acessibilidade
accesskit = "0.24"
accesskit_winit = "0.32"
# -- testes
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
trybuild = "1"
tempfile = "3"

# Release: lto fina + uma unidade de codegen (binarios menores e mais
# rapidos; build de release um pouco mais lento, aceitavel).
[profile.release]
lto = "thin"
codegen-units = 1

# Dev: dependencias compiladas com otimizacao (build incremental do
# proprio codigo segue rapido, mas deps pesadas como wgpu nao arrastam
# o runtime de debug).
[profile.dev.package."*"]
opt-level = 2
