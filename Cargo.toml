[workspace]
# Todos os crates do projeto são members (aparecem como targets na IDE).
members = [
    ".",
    "macros",
    "crates/narrate_macro",
    "crates/narrate",
    "crates/scene3D",
    "crates/snakeGame",
    "crates/basicIDE",
    "crates/editor_core",
    "crates/showcase",
    "crates/git_backend",
]

[package]
name = "plev"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["accessibility"]
accessibility = ["dep:accesskit", "dep:accesskit_winit"]
# Exports the engine's own `#[wasm_bindgen(start)]` entry point on wasm32.
# Off by default so downstream apps (showcase, basicIDE, ...) can define
# their own browser entry without colliding with the engine's.
web-entry = []
android-game-activity = ["winit/android-game-activity"]
hot-reload = ["dep:notify", "dep:notify-debouncer-full"]

[dependencies]
wgpu = "28"
winit = { version = "0.30", features = ["rwh_06"] }
cosmic-text = "0.18"
etagere = "0.2"
bytemuck = { version = "1", features = ["derive"] }
lru = "0.16"
rustc-hash = "2.1"
log = "0.4"
macros = { path = "macros" }
taffy = "0.9"
slotmap = "1.1"
web-time = "1.1"
indexmap = "2"
lyon_tessellation = "1"
lyon_path = "1"
# Image decode for the image atlas (png/jpeg only; no default codecs)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Keymap JSON (actions/keymap.rs)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Editor widget (editor/)
editor_core = { path = "crates/editor_core" }
unicode-segmentation = "1"
accesskit = { version = "0.24", optional = true }
accesskit_winit = { version = "0.32", optional = true }
notify = { version = "7", optional = true }
notify-debouncer-full = { version = "0.4", optional = true }

[dev-dependencies]
narrate = { path = "crates/narrate" }
criterion = { version = "0.5", features = ["html_reports"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
env_logger = "0.11"
# System clipboard for the editor widget (editor/clipboard.rs);
# default features pull in image-data support we don't need.
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "HtmlCanvasElement", "Performance", "console"] }
console_log = "1"
console_error_panic_hook = "0.1"

[package.metadata.android]
package = "com.plev.engine"
label = "plev"

[package.metadata.android.sdk]
min_sdk_version = 28
target_sdk_version = 35

[package.metadata.android.application]
debuggable = true
has_code = false
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"
