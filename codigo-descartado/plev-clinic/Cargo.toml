[package]
name = "plev-clinic"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "plev-clinic"
path = "src/main.rs"

[dependencies]
plev = { path = "../.." }
wgpu = "28"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
env_logger = "0.11"

[workspace]
